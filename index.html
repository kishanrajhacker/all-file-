<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>APK Store — Admin</title>
<meta name="color-scheme" content="light dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{
  --green:#01875F; --green-soft:#e6f5ef; --teal:#22B4C4; --red:#d92d20; --red-soft:#fef3f2;
  --bg:#f4faf7; --surface:#ffffff; --surface-2:#eef7f2; --border:#d3e7dc; --border-strong:#b7d8c8;
  --text:#0e2019; --text-2:#4a655b; --text-3:#7a938a; --shadow:0 1px 2px rgba(14,32,25,.06),0 8px 24px rgba(14,32,25,.06);
  --focus:0 0 0 3px rgba(1,135,95,.35); --brand-grad-a:#01875F; --brand-grad-b:#22B4C4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green:#4FD1A0; --green-soft:#0f2b22; --teal:#3cc7d6; --red:#f97066; --red-soft:#2a1514;
    --bg:#08120f; --surface:#0e1a16; --surface-2:#132520; --border:#1e352d; --border-strong:#2a4a3f;
    --text:#e7f5ee; --text-2:#a7c3b7; --text-3:#7a938a; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
    --focus:0 0 0 3px rgba(79,209,160,.4); --brand-grad-a:#4FD1A0; --brand-grad-b:#3cc7d6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --green:#4FD1A0; --green-soft:#0f2b22; --teal:#3cc7d6; --red:#f97066; --red-soft:#2a1514;
  --bg:#08120f; --surface:#0e1a16; --surface-2:#132520; --border:#1e352d; --border-strong:#2a4a3f;
  --text:#e7f5ee; --text-2:#a7c3b7; --text-3:#7a938a; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  --focus:0 0 0 3px rgba(79,209,160,.4); --brand-grad-a:#4FD1A0; --brand-grad-b:#3cc7d6;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh; overflow-x:hidden;
}
h1,h2,h3,h4{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px}
img{max-width:100%;display:block}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px}

.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
.topbar-inner{display:flex;align-items:center;gap:10px;padding:10px 0;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px}
.brand .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand-grad-a),var(--brand-grad-b));display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;background:transparent;border:1px solid var(--border);border-radius:12px;color:var(--text);transition:.15s}
.icon-btn:hover{background:var(--surface-2)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.tab:hover{background:var(--surface-2)}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.tab .badge{background:rgba(255,255,255,.25);padding:1px 8px;border-radius:999px;font-size:12px}
.tab:not(.active) .badge{background:var(--surface-2);color:var(--text-2)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--text-2);font-size:13px}
.small{font-size:12.5px;color:var(--text-3)}
.hidden{display:none!important}

.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.15s;justify-content:center}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}

.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;font-weight:600;color:var(--text-2)}
.input,.textarea,.select{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);transition:.15s}
.textarea{min-height:88px;resize:vertical}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--green);box-shadow:var(--focus)}
.input.err,.textarea.err{border-color:var(--red)}
.err-msg{color:var(--red);font-size:12.5px;min-height:0}
.form-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .full{grid-column:1/-1}}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;min-height:44px}
.switch input{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--border-strong);position:relative;transition:.2s;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{transform:translateX(18px)}
.switch span{font-size:14px;font-weight:600}

.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.summary{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.stat .n{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:700;line-height:1}
.stat .l{font-size:12.5px;color:var(--text-2);margin-top:4px}
.stat.warn{border-color:var(--red);background:var(--red-soft)}
.stat.warn .n{color:var(--red)}

.toolbar{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
@media(min-width:720px){.toolbar{grid-template-columns:2fr 1fr 1fr 1fr}}
.applist{display:flex;flex-direction:column;gap:10px}
.approw{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
@media(min-width:720px){.approw{grid-template-columns:56px 1fr auto;align-items:center}}
.avatar{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:22px;background:linear-gradient(135deg,var(--green-soft),var(--surface-2));color:var(--green);border:1px solid var(--border);overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.approw .name{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.approw .pkg{font-size:12.5px;color:var(--text-2);word-break:break-all}
.approw .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--text-3)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--text-2)}
.chip.warn{background:var(--red-soft);color:var(--red)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
@media(min-width:720px){.actions{margin-top:0;justify-content:flex-end}}
.star{background:transparent;border:1px solid var(--border);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--text-3)}
.star.on{color:#e8a400;border-color:#e8a400}

@keyframes spinCW{to{transform:rotate(360deg)}}
@keyframes spinCCW{to{transform:rotate(-360deg)}}
@keyframes breathe{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
@keyframes pulseArrow{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.1);opacity:1}}
@keyframes orbit1{to{transform:rotate(360deg)}}
.loader{display:inline-block;position:relative;vertical-align:middle}
.loader svg{display:block;overflow:visible}
.loader .arc{transform-origin:50% 50%;animation:spinCW 1.1s linear infinite}
.loader .dash{transform-origin:50% 50%;animation:spinCCW 1.8s linear infinite}
.loader .orbit{transform-origin:50% 50%;animation:orbit1 2.4s linear infinite}
.loader .dot{transform-origin:50% 50%;animation:breathe 1.2s ease-in-out infinite}
.loader .arrow{transform-origin:50% 50%;animation:pulseArrow .9s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){
  .loader .arc{animation-duration:2.6s}
  .loader .dash{animation-duration:4s}
  .loader .orbit{animation-duration:6s}
  .loader .dot{animation-duration:3s}
  .loader .arrow{animation-duration:2s}
}
.center-loader{display:grid;place-items:center;padding:48px 16px;gap:14px;color:var(--text-2)}

#toasts{position:fixed;left:16px;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:520px;width:100%;animation:toastIn .2s ease-out}
.toast.err{background:var(--red);color:#fff}
.toast.ok{background:var(--green);color:#fff}
@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

.offline-banner{position:fixed;left:0;right:0;top:0;z-index:60;background:var(--red);color:#fff;text-align:center;padding:8px 12px;font-size:13px;font-weight:600;transform:translateY(-100%);transition:.25s}
.offline-banner.show{transform:none}
.offline-banner::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:8px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

.dialog-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:none;place-items:center;padding:16px}
.dialog-backdrop.show{display:grid}
.dialog{background:var(--surface);border-radius:18px;max-width:440px;width:100%;padding:20px;box-shadow:var(--shadow);animation:toastIn .2s}
.dialog h3{font-size:18px;margin-bottom:8px}
.dialog .row{margin-top:16px;justify-content:flex-end}

.section-title{font-size:19px;font-weight:700;margin-bottom:4px}
.banner-info{background:var(--green-soft);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:12px;font-size:13.5px}
.error-card{border-color:var(--red);background:var(--red-soft)}
.empty{text-align:center;padding:40px 16px;color:var(--text-2)}
.empty .big{font-size:40px;margin-bottom:12px}
.fixrow{display:grid;grid-template-columns:1fr;gap:10px;padding:12px;border:1px solid var(--border);border-radius:14px}
@media(min-width:640px){.fixrow{grid-template-columns:2fr 1fr 1fr auto}}
.io-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.io-grid{grid-template-columns:1fr 1fr}}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid var(--border);background:var(--surface-2)}
.preview-row{display:flex;align-items:center;gap:10px}
</style>
</head>
<body>

      <stop offset="0%" stop-color="var(--brand-grad-a)"/>
      <stop offset="100%" stop-color="var(--brand-grad-b)"/>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {

  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ============================================================

  authDomain: "apk-store-kishan-998c4.firebaseapp.com",

  projectId: "apk-store-kishan-998c4",
  storageBucket: "apk-store-kishan-998c4.firebasestorage.app",
  messagingSenderId: "529479289404",
  appId: "1:529479289404:web:ddc8f00f65fae56799d139"
};
const APPS_PATH = "apps";
const GITHUB_USER = "kishanrajhacker";
const GITHUB_REPO = "apk-files";
const GITHUB_TAG = "apps";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const ADMIN_EMAILS = ["krishna95079kr@gmail.com"];

/* ============================================================
   STATE
   ============================================================ */
const state = {
  apps: {},
  unsubApps: null,
  editingId: null,
  isOnline: navigator.onLine,
  connected: false,
  readError: null,
  firstLoad: true,
  saving: false,
  categories: new Set(),
  fixDrafts: {},
};

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const isStr = v => typeof v === "string";
const isNum = v => typeof v === "number" && !isNaN(v);
const num = v => {
  if (isNum(v)) return v;
  if (isStr(v) && v.trim() !== "" && !isNaN(Number(v))) return Number(v);
  return null;
};
const safeLower = v => (isStr(v) ? v.toLowerCase() : "");

const PKG_RE = /^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$/;
const HEX64 = /^[a-f0-9]{64}$/;

function toast(msg, type = "") {
  const t = el("div", "toast" + (type ? " " + type : ""), msg);
  $("#toasts").appendChild(t);
  setTimeout(() => {
    t.style.transition = "opacity .3s";
    t.style.opacity = "0";
    setTimeout(() => t.remove(), 320);
  }, type === "err" ? 20000 : 2600);
  t.addEventListener("click", () => t.remove());
}
function errInfo(e) {
  let who = "login nahi";
  try { who = (auth.currentUser && auth.currentUser.email) || "login nahi"; } catch (_) {}
  return ((e && (e.code || "")) + " " + ((e && e.message) || "")).trim() + " | login: " + who;
}

/* ---------- Theme ---------- */
function applyTheme(theme) {
  try {
    if (theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("apk_admin_theme", theme);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem("apk_admin_theme");
    }
  } catch (_) {}
}
function initTheme() {
  try {
    const t = localStorage.getItem("apk_admin_theme");
    if (t === "dark" || t === "light") applyTheme(t);
  } catch (_) {}
}
initTheme();
$("#themeBtn")?.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur === "dark" || (!cur && matchMedia("(prefers-color-scheme:dark)").matches);
  applyTheme(isDark ? "light" : "dark");
});

/* ============================================================
   LOADER
   ============================================================ */
function createLoader(size = 40) {
  const wrap = el("span", "loader");
  wrap.style.width = size + "px";
  wrap.style.height = size + "px";
  const r = size / 2;
  const inner = r * 0.55;
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);
  svg.setAttribute("viewBox", `0 0 ${size} ${size}`);

  const arc = document.createElementNS(svgNS, "circle");
  arc.setAttribute("class", "arc");
  const arcR = r - 3;
  arc.setAttribute("cx", r); arc.setAttribute("cy", r);
  arc.setAttribute("r", arcR);
  arc.setAttribute("fill", "none");
  arc.setAttribute("stroke", "url(#loaderGrad)");
  arc.setAttribute("stroke-width", Math.max(2.5, size * 0.075));
  arc.setAttribute("stroke-linecap", "round");
  const circ = 2 * Math.PI * arcR;
  const dash = (circ * 0.75);
  arc.setAttribute("stroke-dasharray", `${dash} ${circ}`);
  svg.appendChild(arc);

  const inner2 = document.createElementNS(svgNS, "circle");
  inner2.setAttribute("class", "dash");
  inner2.setAttribute("cx", r); inner2.setAttribute("cy", r);
  inner2.setAttribute("r", inner);
  inner2.setAttribute("fill", "none");
  inner2.setAttribute("stroke", "var(--teal)");
  inner2.setAttribute("stroke-width", Math.max(1.2, size * 0.03));
  inner2.setAttribute("stroke-dasharray", "2 3");
  inner2.setAttribute("opacity", "0.8");
  svg.appendChild(inner2);

  const orbit = document.createElementNS(svgNS, "g");
  orbit.setAttribute("class", "orbit");
  const orbitR = r * 0.62;
  for (let i = 0; i < 3; i++) {
    const ang = (i * 120) * Math.PI / 180;
    const cx = r + orbitR * Math.cos(ang);
    const cy = r + orbitR * Math.sin(ang);
    const dot = document.createElementNS(svgNS, "circle");
    dot.setAttribute("class", "dot");
    dot.setAttribute("cx", cx); dot.setAttribute("cy", cy);
    dot.setAttribute("r", Math.max(1.5, size * 0.055));
    dot.setAttribute("fill", i === 1 ? "var(--teal)" : "var(--green)");
    dot.style.animationDelay = (i * 0.18) + "s";
    dot.style.transformOrigin = `${cx}px ${cy}px`;
    orbit.appendChild(dot);
  }
  svg.appendChild(orbit);

  const arrow = document.createElementNS(svgNS, "g");
  arrow.setAttribute("class", "arrow");
  const a = inner * 0.55;
  const p1 = document.createElementNS(svgNS, "path");
  p1.setAttribute("d", `M ${r - a * 0.5} ${r - a * 0.35} L ${r} ${r + a * 0.15} L ${r + a * 0.5} ${r - a * 0.35}`);
  p1.setAttribute("fill", "none");
  p1.setAttribute("stroke", "var(--green)");
  p1.setAttribute("stroke-width", Math.max(1.8, size * 0.055));
  p1.setAttribute("stroke-linecap", "round");
  p1.setAttribute("stroke-linejoin", "round");
  arrow.appendChild(p1);
  const p2 = document.createElementNS(svgNS, "line");
  p2.setAttribute("x1", r); p2.setAttribute("y1", r - a * 0.65);
  p2.setAttribute("x2", r); p2.setAttribute("y2", r + a * 0.05);
  p2.setAttribute("stroke", "var(--green)");
  p2.setAttribute("stroke-width", Math.max(1.8, size * 0.055));
  p2.setAttribute("stroke-linecap", "round");
  arrow.appendChild(p2);
  svg.appendChild(arrow);

  wrap.appendChild(svg);
  return wrap;
}

/* ============================================================
   NORMALIZE
   ============================================================ */
function asArray(val) {
  if (Array.isArray(val)) return val.slice();
  if (val && typeof val === "object") return Object.values(val);
  if (isStr(val) && val.trim()) return [val];
  return [];
}
function normalize(id, data) {
  const d = (data && typeof data === "object") ? data : {};
  const name = isStr(d.name) ? d.name : (isStr(d.appName) ? d.appName : (isStr(d.title) ? d.title : ""));
  const pkg = isStr(d.packageName) ? d.packageName : (isStr(d.package) ? d.package : "");
  const vCode = num(d.versionCode);
  const version = isStr(d.version) ? d.version : (isStr(d.app_version) ? d.app_version : "");
  const size = isStr(d.size) ? d.size : (isStr(d.appSize) ? d.appSize : "");
  const sizeBytes = num(d.sizeBytes);
  const category = isStr(d.category) ? d.category : (isStr(d.cat) ? d.cat : "");
  const publisher = isStr(d.publisher) ? d.publisher : "";
  const rating = num(d.rating);
  const downloads = isStr(d.downloads) ? d.downloads : (isStr(d.downloadCount) ? d.downloadCount : "");
  const icon = isStr(d.icon) ? d.icon : (isStr(d.iconUrl) ? d.iconUrl : "");
  const apkUrl = isStr(d.apkUrl) ? d.apkUrl : (isStr(d.downloadUrl) ? d.downloadUrl : (isStr(d.url) ? d.url : ""));
  const sha256 = isStr(d.sha256) ? d.sha256.toLowerCase() : "";
  const description = isStr(d.description) ? d.description : "";
  const fullDescription = isStr(d.fullDescription) ? d.fullDescription : "";
  const whatsNew = isStr(d.whatsNew) ? d.whatsNew : (isStr(d.whats_new) ? d.whats_new : "");
  const screenshots = asArray(d.screenshots).filter(s => isStr(s) && s.trim());
  const published = d.published === true || d.published === "true" ? true : (d.published === false || d.published === "false" ? false : true);
  const featured = d.featured === true || d.featured === "true";
  const createdAt = num(d.createdAt);
  const updatedAt = num(d.updatedAt);

  const missingPkg = !pkg || !PKG_RE.test(pkg);
  const missingVC = !(isNum(vCode) && vCode >= 1);

  return {
    id, name, packageName: pkg, versionCode: isNum(vCode) ? vCode : null, version,
    size, sizeBytes, category, publisher, rating: isNum(rating) ? rating : null,
    downloads, icon, apkUrl, sha256, description, fullDescription, whatsNew, screenshots,
    published, featured, createdAt, updatedAt,
    _missingPkg: missingPkg, _missingVC: missingVC, _raw: d
  };
}

function updateOnlineUI() {
  const off = !state.isOnline || !state.connected;
  const banner = $("#offlineBanner");
  if (!state.isOnline) {
    banner.textContent = "Internet nahi hai — changes save nahi honge";
    banner.classList.add("show");
  } else if (!state.connected) {
    banner.textContent = "Server se connection nahi — changes save nahi honge";
    banner.classList.add("show");
  } else {
    banner.classList.remove("show");
  }
  $$("[data-needs-online]").forEach(n => {
    const disabled = off;
    if (n.tagName === "INPUT" && n.type === "checkbox") n.disabled = disabled;
    else if (n.tagName === "BUTTON") n.disabled = disabled;
    else n.setAttribute("aria-disabled", String(disabled));
  });
}
window.addEventListener("online", () => { state.isOnline = true; updateOnlineUI(); });
window.addEventListener("offline", () => { state.isOnline = false; updateOnlineUI(); });

function canWrite() {
  return state.isOnline && state.connected;
}

let unsubConn = null;
function subscribeConnection() {
  if (unsubConn) { try { unsubConn(); } catch(_){} unsubConn = null; }
  try {
    unsubConn = onValue(ref(db, ".info/connected"), (snap) => {
      state.connected = snap.val() === true;
      updateOnlineUI();
    });
  } catch (_) {}
}

   ============================================================ */
window.addEventListener("hashchange", renderRoute);

function navigate(hash) {
  if (location.hash === hash) renderRoute();
  else location.hash = hash;
}

function parseRoute() {
  const h = location.hash || "#/";
  if (h === "#/" || h === "" || h === "#") return { page: "apps" };
  if (h === "#/new") return { page: "new" };
  if (h === "#/fix") return { page: "fix" };
  if (h === "#/io") return { page: "io" };
  const m = h.match(/^#\/edit\/(.+)$/);
  if (m) return { page: "edit", id: decodeURIComponent(m[1]) };
  return { page: "apps" };
}

function updateTabCounts() {
  const apps = Object.values(state.apps);
  $("#appsCount").textContent = String(apps.length);
  const fixable = apps.filter(a => a._missingPkg || a._missingVC).length;
  const badge = $("#fixCount");
  badge.textContent = String(fixable);
  badge.classList.toggle("hidden", fixable === 0);
}

function renderRoute() {
  const r = parseRoute();
  $$(".tab").forEach(t => {
    const k = t.getAttribute("data-tab");
    let active = false;
    if (r.page === "apps" && k === "apps") active = true;
    if ((r.page === "new" || r.page === "edit") && k === "new") active = true;
    if (r.page === "fix" && k === "fix") active = true;
    if (r.page === "io" && k === "io") active = true;
    t.classList.toggle("active", active);
    t.setAttribute("aria-selected", String(active));
  });
  const view = $("#view");
  view.innerHTML = "";

  if (state.firstLoad) {
    const c = el("div", "center-loader");
    c.appendChild(createLoader(52));
    c.appendChild(el("div", "muted", "Apps load ho rahe hain..."));
    view.appendChild(c);
    return;
  }
  if (state.readError) {
    view.appendChild(renderReadError(state.readError));
    return;
  }
  if (r.page === "apps") view.appendChild(renderAppsPage());
  else if (r.page === "new") view.appendChild(renderFormPage(null));
  else if (r.page === "edit") view.appendChild(renderFormPage(r.id));
  else if (r.page === "fix") view.appendChild(renderFixPage());
  else if (r.page === "io") view.appendChild(renderIOPage());
}

function stat(n, l) {
  const s = el("div", "stat");
  s.appendChild(el("div", "n", n));
  s.appendChild(el("div", "l", l));
  return s;
}

function filteredApps() {
  let list = Object.values(state.apps);
  const q = safeLower(listState.search).trim();
  if (q) {
    list = list.filter(a =>
      safeLower(a.name).includes(q) ||
      safeLower(a.packageName).includes(q) ||
      safeLower(a.publisher).includes(q)
    );
  }
  if (listState.category !== "__all__") list = list.filter(a => a.category === listState.category);
  if (listState.status === "published") list = list.filter(a => a.published);
  else if (listState.status === "hidden") list = list.filter(a => !a.published);

  if (listState.sort === "newest") list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  else list.sort((a, b) => safeLower(a.name).localeCompare(safeLower(b.name)));
  return list;
}

function rerenderList() {
  const listEl = $("#appList");

/* ============================================================
   CONFIRM DIALOG
   ============================================================ */
function confirmDelete(name) {
  return new Promise(resolve => {
    const backdrop = $("#dialogBackdrop");
    const input = $("#dlgInput");
    const ok = $("#dlgOk");
    const cancel = $("#dlgCancel");
    const errEl = $("#dlgErr");
    $("#dlgTitle").textContent = "Delete app";
    $("#dlgMsg").textContent = `Kya aap "${name}" ko delete karna chahte hain? Yeh undo nahi hoga. Confirm karne ke liye "Haan, hatao" type karein.`;
    input.value = "";
    ok.disabled = true;
    errEl.textContent = "";
    backdrop.classList.add("show");
    setTimeout(() => input.focus(), 50);

    function cleanup(result) {
      backdrop.classList.remove("show");
      input.removeEventListener("input", onInput);
      cancel.removeEventListener("click", onCancel);
      ok.removeEventListener("click", onOk);
      document.removeEventListener("keydown", onKey);
      resolve(result);
    }
    function onInput() {
      ok.disabled = input.value.trim().toLowerCase() !== "haan, hatao";
      errEl.textContent = "";
    }
    function onCancel() { cleanup(false); }
    function onOk() {
      if (input.value.trim().toLowerCase() !== "haan, hatao") {
        errEl.textContent = "Type exactly: Haan, hatao";
        return;
      }
      cleanup(true);
    }
    function onKey(e) { if (e.key === "Escape") cleanup(false); }
    input.addEventListener("input", onInput);
    cancel.addEventListener("click", onCancel);
    ok.addEventListener("click", onOk);
    document.addEventListener("keydown", onKey);
  });
}

  const swRow = el("div", "row full");

  swRow.appendChild(pubSw);

  featInp.type = "checkbox"; featInp.checked = !!v.featured; featInp.setAttribute("data-needs-online", "1");

  featSw.appendChild(el("span", "", "Featured"));

  apkInput.type = "file";
  apkInput.accept = ".apk,application/vnd.android.package-archive";

  apkInput.setAttribute("data-needs-online", "1");
  apkRow.appendChild(apkInput);
  const apkStatus = el("div", "small");
  apkRow.appendChild(apkStatus);
  apkBox.appendChild(apkRow);
  apkBox.appendChild(el("div", "small", "Sirf file padhi jaati hai — upload nahi hoti. Bade APK ke liye sha256 PC par sha256sum se nikalein."));
  form.appendChild(apkBox);

  apkInput.addEventListener("change", async () => {
    const f = apkInput.files && apkInput.files[0];
    if (!f) return;
    apkStatus.innerHTML = "";
    apkStatus.appendChild(createLoader(18));
    const span = el("span", "", " APK padh rahe hain...");
    apkStatus.appendChild(span);
    let result = null;
    try {
      result = await readApkMeta(f, (p) => { span.textContent = ` APK padh rahe hain... ${Math.round(p)}%`; });
    } catch (_) { result = null; }
    apkStatus.innerHTML = "";
    if (!result) {
      apkStatus.textContent = "Is APK se auto-fill nahi ho paya, manually bharein";
      return;
    }
    let filled = 0;
    if (result.sizeBytes && !fields.size.input.value.trim()) {
      fields.size.input.value = formatBytes(result.sizeBytes); filled++;
    }
    if (result.sizeBytes) fields.size.input.dataset.sizeBytes = String(result.sizeBytes);
    if (result.packageName) {
      if (!fields.packageName.input.value.trim()) { fields.packageName.input.value = result.packageName; filled++; }
      else if (fields.packageName.input.value.trim() !== result.packageName) await maybeReplace(fields.packageName, result.packageName, apkStatus);
    }
    if (result.versionCode != null) {
      if (!fields.versionCode.input.value.trim()) { fields.versionCode.input.value = String(result.versionCode); filled++; }
      else if (String(fields.versionCode.input.value) !== String(result.versionCode)) await maybeReplace(fields.versionCode, String(result.versionCode), apkStatus);
    }
    if (result.versionName) {
      if (!fields.version.input.value.trim()) { fields.version.input.value = result.versionName; filled++; }
      else if (fields.version.input.value.trim() !== result.versionName) await maybeReplace(fields.version, result.versionName, apkStatus);
    }
    if (f.size <= 150 * 1024 * 1024) {
      apkStatus.innerHTML = "";
      apkStatus.appendChild(createLoader(18));
      const span2 = el("span", "", " SHA-256 nikal rahe hain...");
      apkStatus.appendChild(span2);
      try {
        const hex = await sha256File(f, (p) => { span2.textContent = ` SHA-256 nikal rahe hain... ${Math.round(p)}%`; });
        if (hex && !fields.sha256.input.value.trim()) fields.sha256.input.value = hex;
      } catch (_) {}
      apkStatus.innerHTML = "";
    } else {
      apkStatus.textContent = "sha256 bada file ke liye PC par `sha256sum file.apk` chalayein, ya khali chhod dein";
      return;
    }
    apkStatus.textContent = `Auto-fill complete (${filled} fields bhari). Manually check karein.`;
    toast("APK se details mil gayi", "ok");
  });

  function maybeReplace(field, newVal, statusEl) {
    return new Promise(resolve => {
      const holder = el("div", "row");
      holder.style.marginTop = "6px";
      holder.appendChild(el("span", "small", `File me ${newVal} hai. Replace karein?`));
      const yes = el("button", "btn sm primary", "Haan"); yes.type = "button";
      const no = el("button", "btn sm", "Nahi"); no.type = "button";
      holder.appendChild(yes); holder.appendChild(no);
      statusEl.appendChild(holder);
      yes.addEventListener("click", () => { field.input.value = newVal; holder.remove(); resolve(true); });
      no.addEventListener("click", () => { holder.remove(); resolve(false); });
    });
  }

  const btnRow = el("div", "row");
  btnRow.style.marginTop = "8px";
  const saveBtn = el("button", "btn primary", isEdit ? "Save changes" : "App save karein");
  saveBtn.type = "submit";
  saveBtn.setAttribute("data-needs-online", "1");
  const cancel = el("button", "btn", "Cancel");
  cancel.type = "button";
  cancel.addEventListener("click", () => navigate("#/"));
  const loaderHolder = el("span");
  btnRow.appendChild(saveBtn);
  btnRow.appendChild(cancel);
  btnRow.appendChild(loaderHolder);
  form.appendChild(btnRow);

  function setVal(key, val) {
    if (val == null) return;
    if (key === "screenshots") fields.screenshots.input.value = Array.isArray(val) ? val.join("\n") : "";
    else fields[key].input.value = val;
  }
  ["name","packageName","versionCode","version","size","category","publisher","rating","downloads","icon","apkUrl","sha256","description","fullDescription","whatsNew"].forEach(k => setVal(k, v[k]));
  if (v.screenshots && v.screenshots.length) setVal("screenshots", v.screenshots);
  if (v.icon && /^https:\/\//i.test(v.icon)) { thumb.src = v.icon; thumb.style.display = "block"; thumbPh.style.display = "none"; }

  function clearErr(f) { f.err.textContent = ""; f.input.classList.remove("err"); }
  function setErr(f, msg) { f.err.textContent = msg; f.input.classList.add("err"); }

  function validate() {
    let ok = true;
    Object.values(fields).forEach(clearErr);
    if (!fields.name.input.value.trim()) { setErr(fields.name, "Name required"); ok = false; }
    const pkg = fields.packageName.input.value.trim();
    if (!pkg) { setErr(fields.packageName, "Package name required"); ok = false; }
    else if (!PKG_RE.test(pkg)) { setErr(fields.packageName, "Format galat hai (e.g. com.company.app)"); ok = false; }
    const vc = fields.versionCode.input.value.trim();
    if (!vc) { setErr(fields.versionCode, "Version code required"); ok = false; }
    else if (!/^\d+$/.test(vc) || Number(vc) < 1) { setErr(fields.versionCode, "Integer >= 1"); ok = false; }
    const apk = fields.apkUrl.input.value.trim();
    if (!apk) { setErr(fields.apkUrl, "APK URL required"); ok = false; }
    else if (!/^https:\/\//i.test(apk)) { setErr(fields.apkUrl, "https:// se shuru hona chahiye"); ok = false; }
    const icon = fields.icon.input.value.trim();
    if (icon && !/^https:\/\//i.test(icon)) { setErr(fields.icon, "https only"); ok = false; }
    const rating = fields.rating.input.value.trim();
    if (rating) {
      const r = Number(rating);
      if (isNaN(r) || r < 0 || r > 5) { setErr(fields.rating, "0 se 5 ke beech"); ok = false; }
    }
    const sha = fields.sha256.input.value.trim();
    if (sha && !HEX64.test(sha.toLowerCase())) { setErr(fields.sha256, "64 lowercase hex characters"); ok = false; }
    if (pkg && PKG_RE.test(pkg)) {
      const dup = Object.values(state.apps).find(a => a.packageName && a.packageName.toLowerCase() === pkg.toLowerCase() && a.id !== id);
      if (dup) setErr(fields.packageName, "⚠ Yeh package name already exists: " + dup.name);
    }
    const ss = fields.screenshots.input.value.split(/\n+/).map(s => s.trim()).filter(Boolean);
    for (const s of ss) {
      if (!/^https:\/\//i.test(s)) { setErr(fields.screenshots, "Screenshots https only"); ok = false; break; }
    }
    if (isEdit && existing && existing.versionCode && Number(vc) && Number(vc) <= existing.versionCode) {
      toast("Warning: naya versionCode purane se bada nahi hai", "err");
    }
    return ok;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (state.saving) return;
    if (!canWrite()) { toast("Internet nahi hai", "err"); return; }
    if (!validate()) { toast("Form me galtiyan hain", "err"); return; }
    state.saving = true;
    saveBtn.disabled = true;
    loaderHolder.innerHTML = ""; loaderHolder.appendChild(createLoader(24));
    try {
      const data = {
        name: fields.name.input.value.trim(),
        packageName: fields.packageName.input.value.trim(),
        versionCode: Number(fields.versionCode.input.value.trim()),
        version: fields.version.input.value.trim(),
        size: fields.size.input.value.trim(),
        sizeBytes: fields.size.input.dataset.sizeBytes ? Number(fields.size.input.dataset.sizeBytes) : null,
        category: fields.category.input.value.trim(),
        publisher: fields.publisher.input.value.trim(),
        rating: fields.rating.input.value.trim() ? Number(fields.rating.input.value.trim()) : null,
        downloads: fields.downloads.input.value.trim(),
        icon: fields.icon.input.value.trim(),
        apkUrl: fields.apkUrl.input.value.trim(),
        sha256: fields.sha256.input.value.toLowerCase().trim(),
        description: fields.description.input.value.trim(),
        fullDescription: fields.fullDescription.input.value.trim(),
        whatsNew: fields.whatsNew.input.value.trim(),
        screenshots: fields.screenshots.input.value.split(/\n+/).map(s => s.trim()).filter(Boolean),
        published: pubInp.checked,
        featured: featInp.checked,
        updatedAt: serverTimestamp()
      };
      Object.keys(data).forEach(k => { if (data[k] === undefined) delete data[k]; });
      if (isEdit) {
        await update(ref(db, `${APPS_PATH}/${id}`), data);
      } else {
        data.createdAt = serverTimestamp();
        const newRef = push(ref(db, APPS_PATH));
        await set(newRef, data);
      }
      toast("App save ho gaya", "ok");
      navigate("#/");
    } catch (err) {
      toast("Save fail: " + errInfo(err), "err");
    } finally {
      state.saving = false;
      saveBtn.disabled = false;
      loaderHolder.innerHTML = "";
    }
  });

  return form;
}

    return frag;
  }
  const head = el("div", "card pad");
  head.style.marginBottom = "12px";
  head.appendChild(el("h2", "section-title", "Adhoore apps theek karein"));
  head.appendChild(el("p", "muted", "In apps me packageName ya versionCode missing hai. Yahan se theek karein."));
  const allBtn = el("button", "btn primary", "Sab save karein");
  allBtn.type = "button";
  allBtn.setAttribute("data-needs-online", "1");
  allBtn.style.marginTop = "10px";
  allBtn.addEventListener("click", saveAll);

  frag.appendChild(head);

  const list = el("div", "stack");
  apps.forEach(a => {
    const row = el("div", "fixrow card");

    nameWrap.appendChild(el("div", "name", a.name || "(no name)"));
    nameWrap.appendChild(el("div", "small mono", "ID: " + a.id));
    row.appendChild(nameWrap);

    pkgInp.type = "text";
    pkgInp.placeholder = "com.company.app";
    pkgInp.value = a.packageName || "";
    pkgInp.setAttribute("aria-label", "Package name");
    pkgInp.setAttribute("data-needs-online", "1");
    pkgInp.addEventListener("input", () => {
      state.fixDrafts[a.id] = state.fixDrafts[a.id] || {};
      state.fixDrafts[a.id].packageName = pkgInp.value.trim();
    });
    row.appendChild(pkgInp);

    const vcInp = el("input", "input");
    vcInp.type = "number"; vcInp.min = "1";
    vcInp.placeholder = "versionCode";
    vcInp.value = a.versionCode != null ? String(a.versionCode) : "";
    vcInp.setAttribute("aria-label", "Version code");
    vcInp.setAttribute("data-needs-online", "1");
    vcInp.addEventListener("input", () => {
      state.fixDrafts[a.id] = state.fixDrafts[a.id] || {};
      state.fixDrafts[a.id].versionCode = vcInp.value.trim();
    });
    row.appendChild(vcInp);

    const save = el("button", "btn primary sm", "Save");
    save.type = "button";
    save.setAttribute("data-needs-online", "1");
    save.addEventListener("click", () => saveFix(a.id, pkgInp.value.trim(), vcInp.value.trim(), save));
    row.appendChild(save);

    list.appendChild(row);
  });
  frag.appendChild(list);

  async function saveFix(id, pkg, vc, btn) {
    if (!canWrite()) { toast("Internet nahi hai", "err"); return; }
    if (!pkg || !PKG_RE.test(pkg)) { toast("Package name galat hai", "err"); return; }
    const n = Number(vc);
    if (!vc || !Number.isInteger(n) || n < 1) { toast("Version code integer >= 1 hona chahiye", "err"); return; }
    btn.disabled = true;
    const old = btn.textContent; btn.textContent = "Saving...";
    try {
      await update(ref(db, `${APPS_PATH}/${id}`), { packageName: pkg, versionCode: n, updatedAt: serverTimestamp() });
      toast("Save ho gaya", "ok");
    } catch (e) {
      toast("Save fail: " + errInfo(e), "err");
    } finally {
      btn.disabled = false; btn.textContent = old;
    }
  }

  async function saveAll() {
    if (!canWrite()) { toast("Internet nahi hai", "err"); return; }
    let ok = 0, fail = 0;
    for (const a of apps) {
      const d = state.fixDrafts[a.id] || {};
      const pkg = d.packageName || a.packageName;
      const vcStr = d.versionCode || (a.versionCode != null ? String(a.versionCode) : "");
      const vc = Number(vcStr);
      if (!pkg || !PKG_RE.test(pkg) || !Number.isInteger(vc) || vc < 1) { fail++; continue; }
      try {
        await update(ref(db, `${APPS_PATH}/${a.id}`), { packageName: pkg, versionCode: vc, updatedAt: serverTimestamp() });
        ok++;
      } catch (_) { fail++; }
    }
    toast(`${ok} save hue, ${fail} fail`, ok ? "ok" : "err");
  }

  return frag;
}

function renderIOPage() {
  const frag = document.createDocumentFragment();
  const grid = el("div", "io-grid");

  const exp = el("div", "card pad stack");
  exp.appendChild(el("h2", "section-title", "Export JSON"));
  exp.appendChild(el("p", "muted", "Sabhi apps ka JSON copy karein."));

  ta.style.minHeight = "160px";
  ta.readOnly = true;
  exp.appendChild(expBtn);
  exp.appendChild(ta);
  expBtn.addEventListener("click", async () => {
    const arr = Object.values(state.apps).map(a => ({ id: a.id, ...a._raw }));
    const json = JSON.stringify(arr, null, 2);
    ta.value = json;
    try {
      await navigator.clipboard.writeText(json);
      toast("JSON copy ho gaya", "ok");
    } catch (_) {
      ta.focus(); ta.select();
      toast("Copy fail — textarea se manually copy karein", "err");
    }
  });
  grid.appendChild(exp);

  const imp = el("div", "card pad stack");
  imp.appendChild(el("h2", "section-title", "Import JSON"));
  imp.appendChild(el("p", "muted", "Array of apps ya object id->app accept karta hai. Duplicate packageName skip honge."));
  const inTa = el("textarea", "textarea");
  inTa.placeholder = '[{"name":"...","packageName":"...","versionCode":1,"apkUrl":"https://..."}]';
  inTa.style.minHeight = "160px";
  imp.appendChild(inTa);
  const preview = el("div", "small");
  imp.appendChild(preview);
  const impBtn = el("button", "btn primary", "Import karein");
  impBtn.type = "button";
  impBtn.setAttribute("data-needs-online", "1");
  imp.appendChild(impBtn);

  inTa.addEventListener("input", () => {
    preview.textContent = "";
    try {
      const parsed = parseImport(inTa.value);
      preview.textContent = `Preview: ${parsed.length} app objects mile`;
    } catch (_) {
      preview.textContent = "JSON parse nahi hua";
    }
  });

  impBtn.addEventListener("click", async () => {
    if (!canWrite()) { toast("Internet nahi hai", "err"); return; }
    let parsed;
    try { parsed = parseImport(inTa.value); }
    catch (_) { toast("JSON galat hai", "err"); return; }
    if (!parsed.length) { toast("Kuch import karne layak nahi", "err"); return; }
    let imported = 0, skipped = 0;
    const existingPkgs = new Set(Object.values(state.apps).map(a => safeLower(a.packageName)).filter(Boolean));
    for (const obj of parsed) {
      try {
        const pkg = safeLower(obj.packageName);
        if (pkg && existingPkgs.has(pkg)) { skipped++; continue; }
        const data = buildCleanRecord(obj);
        if (!data.name || !data.packageName || !data.apkUrl) { skipped++; continue; }
        data.createdAt = serverTimestamp();
        data.updatedAt = serverTimestamp();
        const newRef = push(ref(db, APPS_PATH));
        await set(newRef, data);
        if (pkg) existingPkgs.add(pkg);
        imported++;
      } catch (_) { skipped++; }
    }
    toast(`${imported} import hue, ${skipped} skip hue`, imported ? "ok" : "err");
    inTa.value = "";
    preview.textContent = "";
  });
  grid.appendChild(imp);
  frag.appendChild(grid);
  return frag;
}

function parseImport(text) {
  const t = text.trim();
  if (!t) return [];
  const parsed = JSON.parse(t);
  let list = [];
  if (Array.isArray(parsed)) list = parsed;
  else if (parsed && typeof parsed === "object") list = Object.values(parsed);
  return list.filter(x => x && typeof x === "object");
}

function buildCleanRecord(obj) {
  const n = normalize("tmp", obj);
  const data = {
    name: n.name,
    packageName: n.packageName,
    versionCode: isNum(n.versionCode) ? n.versionCode : null,
    version: n.version,
    size: n.size,
    category: n.category,
    publisher: n.publisher,
    rating: isNum(n.rating) ? n.rating : null,
    downloads: n.downloads,
    icon: n.icon,
    apkUrl: n.apkUrl,
    sha256: n.sha256,
    description: n.description,
    fullDescription: n.fullDescription,
    whatsNew: n.whatsNew,
    screenshots: n.screenshots,
    published: n.published,
    featured: n.featured
  };
  if (isNum(n.sizeBytes)) data.sizeBytes = n.sizeBytes;
  Object.keys(data).forEach(k => {
    const v = data[k];
    if (v === undefined || v === null || v === "" || (Array.isArray(v) && v.length === 0)) delete data[k];
  });
  return data;
}

/* ============================================================
   APK READER
   ============================================================ */
function formatBytes(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
}

async function sha256File(file, onProgress) {
  const ab = await file.arrayBuffer();
  if (onProgress) onProgress(100);
  const hash = await crypto.subtle.digest("SHA-256", ab);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function readApkMeta(file, onProgress) {
  const sizeBytes = file.size;
  const tailSize = Math.min(66 * 1024, sizeBytes);
  const tailStart = sizeBytes - tailSize;
  let eocdOffset = -1;
  let cdSize = 0, cdOffset = 0;
  try {
    const tail = new Uint8Array(await file.slice(tailStart).arrayBuffer());
    for (let i = tail.length - 22; i >= 0; i--) {
      if (tail[i] === 0x50 && tail[i+1] === 0x4b && tail[i+2] === 0x05 && tail[i+3] === 0x06) { eocdOffset = i; break; }
    }
    if (eocdOffset < 0) return null;
    const dv = new DataView(tail.buffer, tail.byteOffset);
    cdSize = dv.getUint32(eocdOffset + 12, true);
    cdOffset = dv.getUint32(eocdOffset + 16, true);
    if (cdSize === 0xFFFFFFFF || cdOffset === 0xFFFFFFFF) return null;
    if (cdOffset >= sizeBytes) return null;
  } catch (_) { return null; }

  if (onProgress) onProgress(20);

  let cd;
  try {
    cd = new Uint8Array(await file.slice(cdOffset, cdOffset + cdSize).arrayBuffer());
  } catch (_) { return null; }

  const dv = new DataView(cd.buffer, cd.byteOffset);
  let p = 0, manifest = null;
  while (p + 46 <= cd.length) {
    const sig = dv.getUint32(p, true);
    if (sig !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOffset = dv.getUint32(p + 42, true);
    if (p + 46 + nameLen > cd.length) break;
    const name = new TextDecoder("utf-8").decode(cd.subarray(p + 46, p + 46 + nameLen));
    if (name === "AndroidManifest.xml") { manifest = { method, compSize, localOffset }; break; }
    p += 46 + nameLen + extraLen + commentLen;
  }
  if (!manifest) return null;
  if (onProgress) onProgress(35);

  try {
    const lfh = new Uint8Array(await file.slice(manifest.localOffset, manifest.localOffset + 30).arrayBuffer());
    if (lfh.length < 30) return null;
    const ldv = new DataView(lfh.buffer, lfh.byteOffset);
    if (ldv.getUint32(0, true) !== 0x04034b50) return null;
    const fnameLen = ldv.getUint16(26, true);
    const extraLen = ldv.getUint16(28, true);
    const dataStart = manifest.localOffset + 30 + fnameLen + extraLen;
    const dataEnd = dataStart + manifest.compSize;
    const comp = new Uint8Array(await file.slice(dataStart, dataEnd).arrayBuffer());
    let xmlBytes;
    if (manifest.method === 8) {
      const stream = new Blob([comp]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      xmlBytes = new Uint8Array(await new Response(stream).arrayBuffer());
    } else if (manifest.method === 0) {
      xmlBytes = comp;
    } else {
      return null;
    }
    if (onProgress) onProgress(60);
    return parseAxml(xmlBytes, { packageName: null, versionCode: null, versionName: null, sizeBytes });
  } catch (_) { return null; }
}

function parseAxml(bytes, result) {
  try {
    if (bytes.length < 8) return null;
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    if (dv.getUint16(0, true) !== 0x0003) return null;
    let pos = 8, strings = null, foundManifest = false;
    while (pos + 8 <= bytes.length) {
      const chunkType = dv.getUint16(pos, true);
      const headerSize = dv.getUint16(pos + 2, true);
      const chunkSize = dv.getUint32(pos + 4, true);
      if (chunkSize < 8 || pos + chunkSize > bytes.length) break;

      if (chunkType === 0x0001) {
        const strCount = dv.getUint32(pos + 8, true);
        const flags = dv.getUint32(pos + 16, true);
        const stringsStart = dv.getUint32(pos + 20, true);
        const isUtf8 = (flags & 0x100) !== 0;
        const offsetsBase = pos + headerSize;
        strings = [];
        for (let i = 0; i < strCount; i++) {
          const off = dv.getUint32(offsetsBase + i * 4, true);
          try { strings.push(readString(dv, bytes, pos + stringsStart + off, isUtf8)); }
          catch (_) { strings.push(""); }
        }
      } else if (chunkType === 0x0102) {
        if (!strings) break;
        const extStart = pos + headerSize;
        const nameIdx = dv.getUint32(extStart + 4, true);
        const attrStart = dv.getUint16(extStart + 8, true);
        const attrSize = dv.getUint16(extStart + 10, true);
        const attrCount = dv.getUint16(extStart + 12, true);
        const elemName = strings[nameIdx] || "";
        if (elemName === "manifest") {
          const attrsBase = extStart + attrStart;
          for (let a = 0; a < attrCount; a++) {
            const ap = attrsBase + a * attrSize;
            if (ap + 20 > pos + chunkSize) break;
            const attrNameIdx = dv.getUint32(ap + 4, true);
            const rawValue = dv.getInt32(ap + 8, true);
            const dataType = dv.getUint8(ap + 15);
            const attrName = strings[attrNameIdx] || "";
            let strVal = null;
            if (dataType === 0x03) strVal = rawValue >= 0 ? strings[rawValue] : null;
            if (attrName === "package" && strVal != null) result.packageName = strVal;
            else if (attrName === "versionCode" && dataType === 0x10) result.versionCode = dv.getUint32(ap + 16, true);
            else if (attrName === "versionCode" && dataType === 0x11) result.versionCode = dv.getInt32(ap + 16, true);
            else if (attrName === "versionName" && strVal != null) result.versionName = strVal;
          }
          foundManifest = true;
          break;
        }
      }
      pos += chunkSize;
      if (foundManifest) break;
    }
    return foundManifest ? result : null;
  } catch (_) { return null; }
}

function readString(dv, bytes, pos, isUtf8) {
  if (isUtf8) {
    let p = pos;
    let charLen = bytes[p++];
    if (charLen & 0x80) charLen = ((charLen & 0x7f) << 8) | bytes[p++];
    let byteLen = bytes[p++];
    if (byteLen & 0x80) byteLen = ((byteLen & 0x7f) << 8) | bytes[p++];
    return new TextDecoder("utf-8").decode(bytes.subarray(p, p + byteLen));
  } else {
    let p = pos;
    let len = dv.getUint16(p, true); p += 2;
    if (len & 0x8000) {
      const low = len & 0x7fff;
      len = (low << 16) | dv.getUint16(p, true); p += 2;
    }
    const chars = [];
    for (let i = 0; i < len; i++) chars.push(dv.getUint16(p + i * 2, true));
    return String.fromCharCode(...chars);
  }
}

/* ============================================================
   INIT APP
   ============================================================ */
function subscribeApps() {
  if (state.unsubApps) { try { state.unsubApps(); } catch(_){} state.unsubApps = null; }
  try {
    const q = query(ref(db, APPS_PATH), orderByChild("createdAt"));
    state.unsubApps = onValue(q, (snap) => {
      state.firstLoad = false;
      state.readError = null;
      const val = snap.val();
      const map = {};
      if (val && typeof val === "object") {
        Object.keys(val).forEach(k => { map[k] = normalize(k, val[k]); });
      }
      state.apps = map;
      state.categories = new Set(Object.values(map).map(a => a.category).filter(Boolean));
      updateTabCounts();
      renderRoute();
    }, (err) => {
      state.firstLoad = false;
      state.readError = err;
      renderRoute();
    });
  } catch (e) {
    state.firstLoad = false;
    state.readError = e;
    renderRoute();
  }
}

function initApp() {
  state.firstLoad = true;
  state.readError = null;
  state.apps = {};
  renderRoute();
  subscribeApps();
  subscribeConnection();
  updateOnlineUI();
}

/* ============================================================
   LOGIN (sirf ADMIN_EMAILS)
   ============================================================ */
const gate = document.getElementById("gate");
const gateMsg = document.getElementById("gateMsg");
const gateLogin = document.getElementById("gateLogin");
const gateOut = document.getElementById("gateOut");
const userNameEl = document.getElementById("userName");
const signOutBtn = document.getElementById("signOutBtn");
let started = false;

async function doLogin() {
  gateLogin.disabled = true;
  gateMsg.textContent = "Google login khul raha hai…";
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    const code = (e && e.code) || "";
    if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") {
      try { await signInWithRedirect(auth, provider); return; } catch (e2) { e = e2; }
    }
    const c = (e && e.code) || "";
    if (c === "auth/unauthorized-domain") {
      gateMsg.textContent = "Ye domain Firebase me authorized nahi hai. Authentication -> Settings -> Authorized domains me is site ka domain jodein.";
    } else if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") {
      gateMsg.textContent = "Login band kar diya gaya. Dobara try karein.";
    } else {
      gateMsg.textContent = "Login nahi hua: " + ((e && (e.message || e.code)) || "unknown error");
    }
  } finally {
    gateLogin.disabled = false;
  }
}
async function doSignOut() { try { await signOut(auth); } catch (_) {} }
gateLogin.addEventListener("click", doLogin);
gateOut.addEventListener("click", doSignOut);
signOutBtn.addEventListener("click", doSignOut);

function stopListeners() {
  if (state.unsubApps) { try { state.unsubApps(); } catch (_) {} state.unsubApps = null; }
  if (unsubConn) { try { unsubConn(); } catch (_) {} unsubConn = null; }
  started = false;
}

onAuthStateChanged(auth, (user) => {
  const email = ((user && user.email) || "").toLowerCase();
  const isAdmin = !!user && ADMIN_EMAILS.map(x => x.toLowerCase()).includes(email);
  if (isAdmin) {
    gate.classList.add("hidden");
    userNameEl.textContent = user.displayName || user.email;
    userNameEl.classList.remove("hidden");
    signOutBtn.classList.remove("hidden");
    if (!started) {
      started = true;
      if (!location.hash) location.hash = "#/";
      initApp();
    }
  } else {
    stopListeners();
    gate.classList.remove("hidden");
    userNameEl.classList.add("hidden");
    signOutBtn.classList.add("hidden");
    if (user) {
      gateMsg.textContent = "Aap admin nahi hain (" + user.email + "). Sahi Google account se login karein.";
      gateLogin.classList.add("hidden");
      gateOut.classList.remove("hidden");
    } else {
      gateMsg.textContent = "Admin panel ke liye Google se login karein.";
      gateLogin.classList.remove("hidden");
      gateOut.classList.add("hidden");
    }
  }
});
</script>

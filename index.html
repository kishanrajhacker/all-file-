<!DOCTYPE html>
<html lang="hi" data-theme="hacker">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#020a04" />
<title>Premium APK Store — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.45;
  transition:background-color 1.2s ease,color 1.2s ease;
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
img{max-width:100%;display:block}
::selection{background:var(--accent);color:var(--bg)}

:root{
  --bg:#020a04;--bg2:#04140a;
  --surface:rgba(3,20,10,0.86);--surface-2:rgba(3,20,10,0.95);--surface-solid:#04170b;
  --text:#c9ffd8;--text-dim:#6fbf88;--heading:#00ff66;
  --accent:#00ff66;--accent-2:#22d3ee;--accent-contrast:#02110a;
  --danger:#ff4d6d;--warn:#ffd166;--success:#00ff88;
  --border:rgba(0,255,102,0.35);--border-soft:rgba(0,255,102,0.14);
  --radius:2px;--radius-lg:4px;
  --shadow:0 0 0 1px rgba(0,255,102,0.25),0 0 22px rgba(0,255,102,0.12);
  --shadow-lg:0 0 0 1px rgba(0,255,102,0.45),0 0 40px rgba(0,255,102,0.22);
  --font-body:"Share Tech Mono","JetBrains Mono",ui-monospace,monospace;
  --font-head:"Share Tech Mono","JetBrains Mono",ui-monospace,monospace;
  --font-num:"JetBrains Mono",ui-monospace,monospace;
  --glow:0 0 18px var(--accent);
  --fx-opacity:1;--chart-a:#00ff66;--chart-b:#22d3ee;
}

[data-theme="world"]{--bg:#f5f8ff;--bg2:#e8eefc;--surface:rgba(255,255,255,0.92);--surface-2:#ffffff;--surface-solid:#ffffff;--text:#12223d;--text-dim:#54637f;--heading:#0a3d91;--accent:#0a3d91;--accent-2:#ff6b00;--accent-contrast:#ffffff;--danger:#c81e3a;--warn:#b06a00;--success:#0a8f5b;--border:rgba(10,61,145,0.22);--border-soft:rgba(10,61,145,0.1);--radius:12px;--radius-lg:16px;--shadow:0 4px 18px rgba(10,61,145,0.1),0 0 0 1px rgba(10,61,145,0.08);--shadow-lg:0 12px 36px rgba(10,61,145,0.16),0 0 0 1px rgba(10,61,145,0.12);--font-body:"Inter",system-ui,sans-serif;--font-head:"Cinzel","Inter",serif;--font-num:"Inter",system-ui,sans-serif;--glow:0 4px 16px rgba(10,61,145,0.25);--chart-a:#0a3d91;--chart-b:#ff6b00}
[data-theme="cyber"]{--bg:#0b0014;--bg2:#1a0033;--surface:rgba(24,0,40,0.82);--surface-2:rgba(30,0,52,0.94);--surface-solid:#15002a;--text:#f0e6ff;--text-dim:#a48fc9;--heading:#ff2bd6;--accent:#ff2bd6;--accent-2:#00e5ff;--accent-contrast:#0b0014;--danger:#ff3860;--warn:#fcee0a;--success:#00e5a0;--border:rgba(255,43,214,0.45);--border-soft:rgba(255,43,214,0.18);--radius:2px;--radius-lg:4px;--shadow:0 0 0 1px rgba(255,43,214,0.5),0 0 26px rgba(255,43,214,0.28);--shadow-lg:0 0 0 1px rgba(0,229,255,0.6),0 0 40px rgba(255,43,214,0.4);--font-body:"Rajdhani",system-ui,sans-serif;--font-head:"Orbitron",system-ui,sans-serif;--font-num:"Rajdhani",system-ui,sans-serif;--glow:0 0 22px var(--accent);--chart-a:#ff2bd6;--chart-b:#00e5ff}
[data-theme="aurora"]{--bg:#04121a;--bg2:#0a2a2a;--surface:rgba(8,34,40,0.72);--surface-2:rgba(10,42,50,0.9);--surface-solid:#082228;--text:#d8fff4;--text-dim:#7fb8b0;--heading:#3dffb5;--accent:#3dffb5;--accent-2:#a78bfa;--accent-contrast:#04120f;--danger:#ff6b8a;--warn:#ffd166;--success:#3dffb5;--border:rgba(61,255,181,0.3);--border-soft:rgba(61,255,181,0.12);--radius:14px;--radius-lg:18px;--shadow:0 10px 40px rgba(0,0,0,0.4),0 0 0 1px rgba(61,255,181,0.16);--shadow-lg:0 20px 60px rgba(0,0,0,0.5),0 0 0 1px rgba(61,255,181,0.28);--font-body:"Space Grotesk",system-ui,sans-serif;--font-head:"Space Grotesk",system-ui,sans-serif;--font-num:"Space Grotesk",system-ui,sans-serif;--glow:0 0 24px rgba(61,255,181,0.4);--chart-a:#3dffb5;--chart-b:#a78bfa}
[data-theme="synth"]{--bg:#1a0b2e;--bg2:#2a0f4a;--surface:rgba(36,14,62,0.82);--surface-2:rgba(46,18,78,0.94);--surface-solid:#240e3e;--text:#ffe6f7;--text-dim:#c99bd6;--heading:#ffd166;--accent:#ff6ec7;--accent-2:#ffd166;--accent-contrast:#1a0b2e;--danger:#ff4d6d;--warn:#ffd166;--success:#7bffb5;--border:rgba(255,110,199,0.35);--border-soft:rgba(255,110,199,0.14);--radius:8px;--radius-lg:12px;--shadow:0 8px 28px rgba(123,47,247,0.35),0 0 0 1px rgba(255,110,199,0.25);--shadow-lg:0 16px 48px rgba(123,47,247,0.5),0 0 0 1px rgba(255,110,199,0.4);--font-body:"Inter",system-ui,sans-serif;--font-head:"Orbitron",system-ui,sans-serif;--font-num:"Orbitron",system-ui,sans-serif;--glow:0 0 24px rgba(255,110,199,0.5);--chart-a:#ff6ec7;--chart-b:#ffd166}
[data-theme="ocean"]{--bg:#031926;--bg2:#00334e;--surface:rgba(4,40,58,0.82);--surface-2:rgba(6,52,76,0.94);--surface-solid:#04283a;--text:#e6fbff;--text-dim:#7db8cc;--heading:#5eead4;--accent:#00c2ff;--accent-2:#5eead4;--accent-contrast:#031926;--danger:#ff6b8a;--warn:#ffd166;--success:#5eead4;--border:rgba(0,194,255,0.32);--border-soft:rgba(0,194,255,0.14);--radius:18px;--radius-lg:26px;--shadow:0 12px 40px rgba(0,0,0,0.4),0 0 0 1px rgba(0,194,255,0.16);--shadow-lg:0 20px 60px rgba(0,0,0,0.5),0 0 0 1px rgba(94,234,212,0.28);--font-body:"Inter",system-ui,sans-serif;--font-head:"Rajdhani",system-ui,sans-serif;--font-num:"Rajdhani",system-ui,sans-serif;--glow:0 0 24px rgba(0,194,255,0.4);--chart-a:#00c2ff;--chart-b:#5eead4}
[data-theme="gold"]{--bg:#0c0a08;--bg2:#161210;--surface:rgba(28,22,16,0.9);--surface-2:rgba(36,28,20,0.96);--surface-solid:#1c1610;--text:#f5ecd7;--text-dim:#a89068;--heading:#f5d98b;--accent:#d4af37;--accent-2:#f5d98b;--accent-contrast:#0c0a08;--danger:#e05a4f;--warn:#e0b84f;--success:#7fb069;--border:rgba(212,175,55,0.4);--border-soft:rgba(212,175,55,0.16);--radius:4px;--radius-lg:6px;--shadow:0 0 0 1px rgba(212,175,55,0.5),0 0 0 4px rgba(212,175,55,0.12),0 10px 30px rgba(0,0,0,0.5);--shadow-lg:0 0 0 1px rgba(245,217,139,0.7),0 0 0 4px rgba(212,175,55,0.2),0 18px 50px rgba(0,0,0,0.6);--font-body:"Inter",system-ui,sans-serif;--font-head:"Cinzel",serif;--font-num:"Cinzel",serif;--glow:0 0 20px rgba(212,175,55,0.4);--chart-a:#d4af37;--chart-b:#f5d98b}
[data-theme="blueprint"]{--bg:#06223f;--bg2:#0a2f52;--surface:rgba(8,40,70,0.88);--surface-2:rgba(10,48,84,0.96);--surface-solid:#082846;--text:#d6ecff;--text-dim:#7ba7cf;--heading:#7dd3fc;--accent:#7dd3fc;--accent-2:#a5f3fc;--accent-contrast:#06223f;--danger:#ff7b93;--warn:#fde68a;--success:#7dd3fc;--border:rgba(125,211,252,0.4);--border-soft:rgba(125,211,252,0.16);--radius:2px;--radius-lg:3px;--shadow:0 0 0 1px rgba(125,211,252,0.4),0 0 20px rgba(125,211,252,0.1);--shadow-lg:0 0 0 1px rgba(165,243,252,0.6),0 0 36px rgba(125,211,252,0.2);--font-body:"JetBrains Mono",ui-monospace,monospace;--font-head:"JetBrains Mono",ui-monospace,monospace;--font-num:"JetBrains Mono",ui-monospace,monospace;--glow:0 0 18px rgba(125,211,252,0.5);--chart-a:#7dd3fc;--chart-b:#a5f3fc}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:var(--fx-opacity);transition:opacity 1.2s ease}
.bg-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.bg-layer.on{opacity:1}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1200px 800px at 20% 0%,var(--bg2),var(--bg) 70%);transition:background 1.2s ease}

.app{max-width:1120px;margin:0 auto;padding:0 16px 120px}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin:0 -16px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);backdrop-filter:blur(10px);transition:background-color 1.2s ease,border-color 1.2s ease}
.brand{font-family:var(--font-head);font-weight:700;font-size:1.05rem;color:var(--heading);letter-spacing:.5px;text-shadow:var(--glow);display:flex;align-items:center;gap:8px}
.brand .cursor{display:inline-block;width:9px;height:18px;background:var(--accent);animation:blink 1s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.topbar .grow{flex:1}
.userbox{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text-dim)}
.userbox img{width:28px;height:28px;border-radius:50%;border:1px solid var(--border)}
.hdr-sub{font-size:.72rem;color:var(--text-dim);width:100%;order:99}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 14px;min-height:44px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border-soft);color:var(--text-dim);font-family:var(--font-head);font-size:.82rem;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .25s ease}
.tab:hover{border-color:var(--border);color:var(--text)}
.tab.active{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);box-shadow:var(--glow)}
.tab .badge{background:var(--danger);color:#fff;border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:.68rem;padding:0 6px;font-family:var(--font-num)}
.tab.active .badge{background:var(--accent-contrast);color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px;transition:background-color 1.2s ease,border-color 1.2s ease,box-shadow 1.2s ease,transform .2s ease}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
h1,h2,h3{font-family:var(--font-head);color:var(--heading);margin:0 0 10px;line-height:1.25;letter-spacing:.3px}
h1{font-size:1.4rem}
h2{font-size:1.1rem}
h3{font-size:.95rem}
p{margin:0 0 10px}
.muted{color:var(--text-dim)}
.small{font-size:.78rem}
.mono{font-family:var(--font-num)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:600;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;border:1px solid transparent}
.chip.pending{background:rgba(255,209,102,.14);color:var(--warn);border-color:rgba(255,209,102,.5)}
.chip.approved{background:rgba(61,255,181,.14);color:var(--success);border-color:rgba(61,255,181,.5)}
.chip.rejected,.chip.revoked{background:rgba(255,77,109,.14);color:var(--danger);border-color:rgba(255,77,109,.5)}
.price-badge{font-family:var(--font-num);font-weight:700;color:var(--accent-contrast);background:linear-gradient(135deg,var(--accent),var(--accent-2));padding:4px 12px;border-radius:999px;font-size:.82rem;box-shadow:var(--glow)}

label{display:block;font-size:.8rem;font-weight:600;color:var(--text-dim);margin-bottom:4px;font-family:var(--font-head)}
input[type=text],input[type=url],input[type=number],input[type=email],input[type=search],select,textarea{width:100%;padding:11px 12px;min-height:44px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.field{margin-bottom:12px}
.err{color:var(--danger);font-size:.74rem;margin-top:3px;min-height:1em}
.field.invalid input,.field.invalid textarea,.field.invalid select{border-color:var(--danger)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{width:46px;height:26px;border-radius:999px;background:var(--border-soft);border:1px solid var(--border);position:relative;transition:background .25s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-dim);transition:transform .25s,background .25s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(20px);background:var(--accent-contrast)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:600;font-size:.86rem;font-family:var(--font-head);transition:transform .12s ease,filter .2s ease,box-shadow .2s ease,background .2s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.4)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-contrast);border-color:transparent;box-shadow:var(--glow)}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.78rem}
.btn.icon{padding:8px;min-width:44px}
.btn.block{width:100%}
.quick-prices{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.order-card{border-left:4px solid var(--warn)}
.order-card.approved{border-left-color:var(--success)}
.order-card.rejected,.order-card.revoked{border-left-color:var(--danger)}
.order-head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.order-head .name{font-weight:700;font-size:1rem;font-family:var(--font-head)}
.order-meta{font-size:.78rem;color:var(--text-dim)}
.utr-line{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.utr{font-family:var(--font-num);font-size:1.05rem;letter-spacing:2px;font-weight:700;color:var(--accent)}
.copy-btn{background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:.72rem;color:var(--text-dim)}
.flag{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block}
.flag.warn{background:rgba(255,209,102,.16);color:var(--warn);border:1px solid rgba(255,209,102,.5)}
.flag.bad{background:rgba(255,77,109,.16);color:var(--danger);border:1px solid rgba(255,77,109,.5)}
.flag.ok{background:rgba(61,255,181,.16);color:var(--success);border:1px solid rgba(61,255,181,.5)}

.app-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.app-row:last-child{border-bottom:0}
.avatar{width:46px;height:46px;border-radius:var(--radius);flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-contrast);font-weight:800;font-family:var(--font-head);font-size:1.1rem;overflow:hidden;box-shadow:var(--glow)}
.avatar img{width:100%;height:100%;object-fit:cover}
.app-info{flex:1;min-width:180px}
.app-info .nm{font-weight:700;font-family:var(--font-head)}
.app-info .pk{font-family:var(--font-num);font-size:.74rem;color:var(--text-dim);word-break:break-all}
.app-actions{display:flex;gap:6px;flex-wrap:wrap}

.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.summary-grid .box{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px;text-align:center}
.summary-grid .box .n{font-family:var(--font-num);font-size:1.5rem;font-weight:800;color:var(--heading)}
.summary-grid .box .l{font-size:.72rem;color:var(--text-dim)}

.table-wrap{overflow-x:auto;border:1px solid var(--border-soft);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border-soft)}
th{font-family:var(--font-head);color:var(--text-dim);font-size:.74rem;font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-btn{min-height:44px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border-soft);background:var(--surface);color:var(--text-dim);font-weight:600;font-size:.82rem;font-family:var(--font-head)}
.filter-btn.active{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)}

.loader-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px}
.loader-text{font-size:.8rem;color:var(--text-dim)}
.spin-outer{animation:spinCW 1.1s linear infinite;transform-origin:50% 50%}
.spin-inner{animation:spinCCW 1.8s linear infinite;transform-origin:50% 50%}
.spin-dot{animation:breathe 1.2s ease-in-out infinite;transform-origin:50% 50%}
.spin-arrow{animation:pulseArrow .9s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes spinCW{to{transform:rotate(360deg)}}

function byId(id){ return document.getElementById(id); }

function el(tag, props = {}, ...children){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)){
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(e.dataset, v);
    else if (v === true) e.setAttribute(k, "");
    else if (v === false || v == null) {}
    else e.setAttribute(k, v);
  }
  for (const c of children){
    if (c == null) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}
function esc(str){

function normalizeArray(v){ if (!v) return []; if (Array.isArray(v)) return v.filter(x => x != null); if (typeof v === "object") return Object.values(v).filter(x => x != null); return []; }

function createLoader(size = 56){
  const wrap = el("div", { class: "loader-wrap" });
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", String(size));
  svg.setAttribute("height", String(size));
  svg.setAttribute("viewBox", "0 0 100 100");
  svg.setAttribute("aria-label", "Loading");
  const cx = 50, cy = 50, rOuter = 40, rInner = 27, rDots = 14, rArrow = 7;
  const arc = document.createElementNS(svgNS, "path");
  const a1 = -90 * Math.PI/180, a2 = 180 * Math.PI/180;
  const x1 = cx + rOuter*Math.cos(a1), y1 = cy + rOuter*Math.sin(a1);
  const x2 = cx + rOuter*Math.cos(a2), y2 = cy + rOuter*Math.sin(a2);
  arc.setAttribute("d", `M ${x1} ${y1} A ${rOuter} ${rOuter} 0 1 1 ${x2} ${y2}`);
  arc.setAttribute("fill", "none");
  arc.setAttribute("stroke", "url(#loadGrad)");
  arc.setAttribute("stroke-width", "7");
  arc.setAttribute("stroke-linecap", "round");
  arc.setAttribute("class", "spin-outer");
  svg.appendChild(arc);
  const inner = document.createElementNS(svgNS, "circle");
  inner.setAttribute("cx", String(cx)); inner.setAttribute("cy", String(cy));
  inner.setAttribute("r", String(rInner));
  inner.setAttribute("fill", "none");
  inner.setAttribute("stroke", "var(--accent-2)");
  inner.setAttribute("stroke-width", "2.5");
  inner.setAttribute("stroke-dasharray", "4 7");
  inner.setAttribute("opacity", "0.85");
  inner.setAttribute("class", "spin-inner");
  svg.appendChild(inner);
  for (let i = 0; i < 3; i++){
    const ang = (i * 120) * Math.PI/180;
    const dx = cx + rDots*Math.cos(ang), dy = cy + rDots*Math.sin(ang);
    const dot = document.createElementNS(svgNS, "circle");
    dot.setAttribute("cx", String(dx)); dot.setAttribute("cy", String(dy));
    dot.setAttribute("r", "3.4");
    dot.setAttribute("fill", "var(--accent)");
    dot.setAttribute("class", "spin-dot");
    dot.style.animationDelay = (i * 0.22) + "s";
    svg.appendChild(dot);
  }
  const arrow = document.createElementNS(svgNS, "path");
  arrow.setAttribute("d", `M ${cx} ${cy - rArrow} v ${rArrow * 1.6} M ${cx - 5.5} ${cy + 1} L ${cx} ${cy + 6.5} L ${cx + 5.5} ${cy + 1} M ${cx - 6} ${cy + 8.5} h 12`);

  arrow.setAttribute("stroke-width", "2.4");
  arrow.setAttribute("stroke-linecap", "round");
  arrow.setAttribute("stroke-linejoin", "round");
  arrow.setAttribute("class", "spin-arrow");
  svg.appendChild(arrow);
  wrap.appendChild(svg);
  return wrap;
}

let audioCtx = null;
let userGestureDone = false;
function ensureAudio(){
  try{
    if (!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){}
}
function beep(){
  if (!userGestureDone || !audioCtx) return;
  try{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.28);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.3);
  }catch(e){}
}
document.addEventListener("pointerdown", () => { userGestureDone = true; ensureAudio(); }, { once: true });

  try{ localStorage.setItem("themePref", JSON.stringify(themeLocked ? { mode: "locked", idx: themeIdx } : { mode: "auto" })); }catch(e){}
}
function applyTheme(idx){
  if (idx < 0) idx = THEMES.length - 1;
  if (idx >= THEMES.length) idx = 0;
  themeIdx = idx;
  const t = THEMES[themeIdx];
  try{
    document.documentElement.setAttribute("data-theme", t.id);
    const pillName = byId("themeName");
    if (pillName) pillName.textContent = t.name;
    $$("#themeDots .dot").forEach((d, i) => d.classList.toggle("active", i === themeIdx));
    updateProgress();
    stopFx();
    startFx(t.fx);
  }catch(e){}
  saveThemePref();
  themeStart = nowMs();
}
function updateProgress(){
  try{
    const circ = byId("progCircle");
    if (!circ) return;
    if (cyclePaused || themeLocked){ circ.style.strokeDashoffset = "0"; return; }
    const elapsed = Math.min(THEME_MS, nowMs() - themeStart);
    const frac = 1 - elapsed / THEME_MS;
    const C = 62.83;
    circ.style.strokeDashoffset = String(C * (1 - frac));
  }catch(e){}
}
function buildThemeDots(){
  const wrap = byId("themeDots");
  if (!wrap) return;
  wrap.innerHTML = "";
  THEMES.forEach((t, i) => {
    const b = el("button", { class: "dot" + (i === themeIdx ? " active" : ""), type: "button", "aria-label": t.name, title: t.name });
    b.style.background = THEME_DOTS_COLORS[i] || "var(--accent)";
    b.addEventListener("click", () => { themeLocked = true; cyclePaused = true; setPauseBtn(); applyTheme(i); });
    wrap.appendChild(b);
  });
}
function setPauseBtn(){
  const b = byId("playPause");
  if (!b) return;
  b.textContent = (cyclePaused || themeLocked) ? "▶" : "⏸";
  b.setAttribute("aria-label", (cyclePaused || themeLocked) ? "Play" : "Pause");
}
function startThemeCycle(){
  stopThemeCycle();
  themeInterval = setInterval(() => {
    updateProgress();
    if (cyclePaused || themeLocked || document.hidden) return;
    const elapsed = nowMs() - themeStart;
    if (elapsed >= THEME_MS) applyTheme((themeIdx + 1) % THEMES.length);
  }, 250);
  setInterval(updateProgress, 500);
}
function stopThemeCycle(){ if (themeInterval) clearInterval(themeInterval); themeInterval = null; }
function pauseAuto(){ cyclePaused = true; setPauseBtn(); }
function resumeAuto(){ if (!themeLocked){ cyclePaused = false; setPauseBtn(); themeStart = nowMs(); } }

const fxCanvas = byId("fx");
const fxCtx = fxCanvas ? fxCanvas.getContext("2d") : null;
let fxRAF = null;
let fxMode = null;
let fxParticles = [];
let fxLast = 0;
let fxFps = 30;
let fxAcc = 0;
let fxFrameCount = 0;
let fxSlowFrames = 0;

function sizeCanvas(){
  try{
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    fxCanvas.width = Math.floor(window.innerWidth * dpr);
    fxCanvas.height = Math.floor(window.innerHeight * dpr);
    fxCanvas.style.width = window.innerWidth + "px";
    fxCanvas.style.height = window.innerHeight + "px";
    if (fxCtx) fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }catch(e){}
}
function isNarrow(){ return window.innerWidth < 600; }
function stopFx(){
  if (fxRAF){ cancelAnimationFrame(fxRAF); fxRAF = null; }
  if (fxCtx){ try{ fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height); }catch(e){} }
  fxMode = null; fxParticles = [];
  const layer = byId("cssFx");
  if (layer){ layer.className = "bg-layer"; layer.style.background = ""; }
}
function startFx(mode){
  if (!fxCanvas || !fxCtx) return;
  sizeCanvas();
  fxLast = 0; fxAcc = 0; fxFrameCount = 0; fxSlowFrames = 0;
  const layer = byId("cssFx");
  if (layer){ layer.className = "bg-layer on"; layer.style.background = ""; }
  if (mode === "css" || reduceMotion || lowEnd){
    if (reduceMotion || lowEnd){
      if (layer) layer.style.background = "radial-gradient(circle at 30% 20%, rgba(255,255,255,0.06), transparent 60%), radial-gradient(circle at 70% 80%, rgba(255,255,255,0.04), transparent 60%)";
    }
    return;
  }
  fxMode = mode;
  if (mode === "matrix"){
    const cols = isNarrow() ? 22 : 42;
    fxParticles = [];
    for (let i = 0; i < cols; i++){
      fxParticles.push({ x: (i + 0.5) * (window.innerWidth / cols), y: Math.random() * window.innerHeight, speed: 40 + Math.random() * 90, chars: "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789", char: "", tick: 0 });
    }
  } else if (mode === "stars"){
    const count = isNarrow() ? 80 : 180;
    fxParticles = [];
    for (let i = 0; i < count; i++){
      fxParticles.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, z: Math.random() * 0.8 + 0.2, r: Math.random() * 1.6 + 0.4, tw: Math.random() * Math.PI * 2, twSpeed: 0.5 + Math.random() * 1.5 });
    }
  } else if (mode === "bubbles"){
    const count = isNarrow() ? 20 : 40;
    fxParticles = [];
    for (let i = 0; i < count; i++){
      fxParticles.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, r: 3 + Math.random() * 10, speed: 15 + Math.random() * 40, wobble: Math.random() * Math.PI * 2, ws: 0.5 + Math.random() });
    }
  } else if (mode === "gold"){
    const count = isNarrow() ? 15 : 30;
    fxParticles = [];
    for (let i = 0; i < count; i++){
      fxParticles.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, r: 0.8 + Math.random() * 2.2, speed: 4 + Math.random() * 12, phase: Math.random() * Math.PI * 2 });
    }
  }
  fxRAF = requestAnimationFrame(fxLoop);
}
function fxLoop(ts){
  if (!fxCtx || !fxCanvas) return;
  if (document.hidden){ fxRAF = requestAnimationFrame(fxLoop); return; }
  const dt = fxLast ? Math.min(120, ts - fxLast) : 16;
  fxLast = ts;
  fxAcc += dt;
  if (fxAcc < 1000 / fxFps){ fxRAF = requestAnimationFrame(fxLoop); return; }
  fxAcc = 0;
  fxFrameCount++;
  if (dt > 55){
    fxSlowFrames++;
    if (fxSlowFrames > 24 && !lowEnd){
      lowEnd = true; stopFx(); startFx("css");
      if (byId("cssFx")) byId("cssFx").style.background = "radial-gradient(circle at 30% 20%, rgba(255,255,255,0.06), transparent 60%)";
      return;
    }
  } else if (fxSlowFrames > 0) fxSlowFrames--;
  const W = window.innerWidth, H = window.innerHeight;
  try{
    fxCtx.clearRect(0, 0, W, H);
    if (fxMode === "matrix"){
      fxCtx.font = "14px 'Share Tech Mono', monospace";
      const colW = W / fxParticles.length;
      for (const p of fxParticles){
        p.y += p.speed * dt / 1000;
        if (p.y > H + 20){ p.y = -20; p.x = (Math.random() * fxParticles.length + 0.5) * colW; p.tick = 0; }
        p.tick++;
        if (p.tick % 3 === 0 || !p.char) p.char = p.chars[Math.floor(Math.random() * p.chars.length)];
        const trail = 6;
        for (let k = 0; k < trail; k++){
          const yy = p.y - k * 15;
          if (yy < -10 || yy > H) continue;
          const alpha = (1 - k / trail) * 0.18;
          fxCtx.fillStyle = k === 0 ? "rgba(0,255,102,0.55)" : "rgba(0,255,102," + alpha + ")";
          fxCtx.fillText(p.char, p.x, yy);
        }
      }
    } else if (fxMode === "stars"){
      const tSec = ts / 1000;
      for (const p of fxParticles){
        const a = 0.25 + 0.6 * (0.5 + 0.5 * Math.sin(tSec * p.twSpeed + p.tw));
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.r * p.z, 0, Math.PI * 2);
        fxCtx.fillStyle = "rgba(255,255,255," + (a * p.z) + ")";
        fxCtx.fill();
        if (p.z > 0.7){
          fxCtx.beginPath();
          fxCtx.arc(p.x, p.y, p.r * 2.4, 0, Math.PI * 2);
          fxCtx.fillStyle = "rgba(139,92,246," + (a * 0.12) + ")";
          fxCtx.fill();
        }
      }
    } else if (fxMode === "bubbles"){
      for (const p of fxParticles){
        p.y -= p.speed * dt / 1000;
        p.wobble += dt / 900 * p.ws;
        const x = p.x + Math.sin(p.wobble) * 8;
        if (p.y < -20){ p.y = H + 20; p.x = Math.random() * W; }
        fxCtx.beginPath();
        fxCtx.arc(x, p.y, p.r, 0, Math.PI * 2);
        fxCtx.strokeStyle = "rgba(0,194,255,0.35)";
        fxCtx.lineWidth = 1.2;
        fxCtx.stroke();
        fxCtx.beginPath();
        fxCtx.arc(x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.25, 0, Math.PI * 2);
        fxCtx.fillStyle = "rgba(230,251,255,0.5)";
        fxCtx.fill();
      }
    } else if (fxMode === "gold"){
      const tSec = ts / 1000;
      for (const p of fxParticles){
        p.y -= p.speed * dt / 1000;
        if (p.y < -10){ p.y = H + 10; p.x = Math.random() * W; }
        const tw = 0.5 + 0.5 * Math.sin(tSec * 1.4 + p.phase);
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        fxCtx.fillStyle = "rgba(212,175,55," + (0.2 + tw * 0.5) + ")";
        fxCtx.fill();
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.r * 2.2, 0, Math.PI * 2);
        fxCtx.fillStyle = "rgba(245,217,139," + (tw * 0.08) + ")";
        fxCtx.fill();
      }
    }
  }catch(e){}
  fxRAF = requestAnimationFrame(fxLoop);
}

let tiltRAF = null;
function handleTilt(e, card){
  if (reduceMotion) return;
  if (document.documentElement.getAttribute("data-theme") !== "depth") return;
  const r = card.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width - 0.5;
  const py = (e.clientY - r.top) / r.height - 0.5;
  const rx = Math.max(-6, Math.min(6, -py * 6));
  const ry = Math.max(-6, Math.min(6, px * 6));
  if (tiltRAF) cancelAnimationFrame(tiltRAF);
  tiltRAF = requestAnimationFrame(() => { card.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(4px)`; });
}
function resetTilt(card){ if (card) card.style.transform = ""; }

function setOnline(isOn){
  online = isOn && navigator.onLine;
  const bar = byId("offlineBar");
  if (bar) bar.classList.toggle("on", !online);
  document.querySelectorAll("[data-write]").forEach(b => {
    if (b.disabled && b.dataset.wasDisabled === "0") return;
    b.disabled = !online;
    if (online) delete b.dataset.wasDisabled;
    else b.dataset.wasDisabled = "1";
  });
  if (!online) toast("Internet nahi hai — changes save nahi honge", "bad", 4200);
}
window.addEventListener("online", () => setOnline(true));
window.addEventListener("offline", () => setOnline(false));

async function doGoogleLogin(){
  const gate = byId("gate");
  gate.classList.add("loading");

  try{
    await signInWithPopup(auth, provider);
  }catch(err){
    const code = (err && err.code) || "";
    if (code === "auth/popup-blocked" || code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request"){
      try{ await signInWithRedirect(auth, provider); }
      catch(e2){ gate.classList.remove("loading"); gateError(friendlyAuthError(e2)); }
    } else {
      gate.classList.remove("loading");
      gateError(friendlyAuthError(err));
    }

function friendlyAuthError(err){
  const code = (err && err.code) || "";
  if (code === "auth/unauthorized-domain") return "Ye domain allow nahi hai. Firebase -> Authentication -> Settings -> Authorized domains me is site ka domain jodein.";
  if (code === "auth/popup-blocked") return "Popup block ho gaya. Browser me popup allow karein ya dobara try karein.";
  if (code === "auth/popup-closed-by-user") return "Popup band ho gaya. Dobara 'Google se login' dabayein.";
  if (code === "auth/network-request-failed") return "Network problem. Internet check karein.";
  return "Login fail: " + (err && err.message ? err.message : "unknown");
}

function cleanupSubs(){
  unsubs.forEach(u => { try{ u(); }catch(e){} });
  unsubs = [];
  state.orders = {}; state.paidApps = {}; state.premiumLinks = {}; state.purchases = {};
}
function initData(){
  cleanupSubs();
  const uOrders = onValue(ref(db, "orders"), snap => {
    const v = snap.val();
    const normalized = {};
    if (v && typeof v === "object"){
      for (const [uid, orders] of Object.entries(v)){
        if (orders && typeof orders === "object") normalized[uid] = orders;
      }
    }
    const prevPending = countPending(state.orders);
    state.orders = normalized;
    const newPending = countPending(state.orders);
    if (newPending > prevPending && prevPending >= 0){ toast("Naya order aaya", "ok", 4000); beep(); }
    renderOrdersBadge();
    rerenderIf("orders"); rerenderIf("customers"); rerenderIf("sales");
  }, err => dbError(err));
  unsubs.push(uOrders);

  const uApps = onValue(ref(db, "paidApps"), snap => {
    state.paidApps = normalizeObj(snap.val());
    rerenderIf("apps"); rerenderIf("customers"); rerenderIf("sales"); rerenderIf("orders");
  }, err => dbError(err));
  unsubs.push(uApps);

  const uLinks = onValue(ref(db, "premiumLinks"), snap => {
    state.premiumLinks = normalizeObj(snap.val());
    rerenderIf("apps"); rerenderIf("orders");
  }, err => dbError(err));
  unsubs.push(uLinks);

  const uPurch = onValue(ref(db, "purchases"), snap => {
    state.purchases = normalizeObj(snap.val());
    rerenderIf("customers"); rerenderIf("apps"); rerenderIf("orders");
  }, err => dbError(err));
  unsubs.push(uPurch);

  const uConn = onValue(ref(db, ".info/connected"), snap => {
    rtdbConnected = snap.val() === true;
    if (online && !rtdbConnected) setOnline(navigator.onLine);
  }, () => {});
  unsubs.push(uConn);
}
function countPending(ordersNode){
  let n = 0;
  for (const uid of Object.keys(ordersNode || {})){
    for (const oid of Object.keys(ordersNode[uid] || {})){
      if (ordersNode[uid][oid] && ordersNode[uid][oid].status === "pending") n++;
    }
  }
  return n;
}
function dbError(err){
  const code = err && err.code ? err.code : "";
  let msg = "Database error: " + (err && err.message ? err.message : "unknown");
  if (code === "PERMISSION_DENIED" || /permission/i.test(msg)){
    msg = "Permission denied. Rules publish karein aur sahi email se login karein.";
  }
  toast(msg, "bad", 6000);
}

function allOrders(){
  const list = [];
  for (const [uid, orders] of Object.entries(state.orders || {})){
    for (const [oid, o] of Object.entries(orders || {})){
      if (!o || typeof o !== "object") continue;
      list.push({ uid, oid, ...o });
    }
  }
  return list;
}
function appById(appId){
  if (!appId) return null;
  return state.paidApps[appId] || null;
}
function findUtrDuplicates(orders){
  const counts = {};
  for (const o of orders){ if (!o || !o.utr) continue; const u = String(o.utr); counts[u] = (counts[u] || 0) + 1; }
  const dups = new Set();
  for (const [u, c] of Object.entries(counts)) if (c > 1) dups.add(u);
  return dups;
}
function normalizeOrder(o, uid, oid){
  if (!o || typeof o !== "object") return null;
  return {
    uid: o.uid || uid, oid, email: o.email || "", appId: o.appId || "",
    appName: o.appName || "", amount: num(o.amount, 0), utr: o.utr ? String(o.utr) : "",
    status: o.status || "pending", createdAt: num(o.createdAt, 0), approvedAt: num(o.approvedAt, 0), note: o.note || ""
  };
}
function normalizeApp(a){
  if (!a || typeof a !== "object") return null;
  return {
    name: a.name || "", packageName: a.packageName || "", versionCode: num(a.versionCode, 1),
    version: a.version || "", size: a.size || "", sizeBytes: num(a.sizeBytes, 0),
    category: a.category || "", publisher: a.publisher || "", rating: num(a.rating, 0),
    downloads: a.downloads || "", icon: a.icon || "", description: a.description || "",
    fullDescription: a.fullDescription || "", whatsNew: a.whatsNew || "",
    screenshots: normalizeArray(a.screenshots), price: num(a.price, 0),
    published: a.published === false ? false : true, featured: a.featured === true,
    createdAt: num(a.createdAt, 0), updatedAt: num(a.updatedAt, 0)
  };
}

const routes = { orders: renderOrders, apps: renderApps, new: renderNewApp, customers: renderCustomers, sales: renderSales, io: renderIO };
let currentRoute = "orders";
function parseHash(){
  let h = location.hash.replace(/^#\/?/, "").trim();
  if (!h) h = "orders";
  const parts = h.split("/");
  return { route: parts[0] || "orders", param: parts[1] || "" };
}
function route(){
  if (!currentUser || !isAdmin(currentUser.email)) return;
  const { route: r, param } = parseHash();
  if (!routes[r] && r !== "edit") r = "orders";
  currentRoute = r;
  $$(".tab").forEach(t => {
    const active = (t.dataset.tab === r) || (r === "edit" && t.dataset.tab === "apps");
    t.classList.toggle("active", active);
  });
  const view = byId("view");
  if (!view) return;
  view.innerHTML = "";
  if (r === "edit"){
    if (param) renderNewApp(param); else renderApps(view);
  } else {
    routes[r](view);
  }
}
window.addEventListener("hashchange", route);
function rerenderIf(routeName){
  if (currentRoute === routeName || (routeName === "apps" && currentRoute === "edit")){
    if (currentRoute !== "edit") route();
    else if (routeName === "apps") route();
  }
}

  const counts = {
    pending: all.filter(o => o.status === "pending").length,

  header.appendChild(el("p", { class: "small muted", text: "Pehle apne UPI/bank app me UTR aur amount check karein, phir Approve karein." }));

    b.addEventListener("click", () => { orderFilter = key; route(); });
    return b;
  };
  filters.appendChild(mkFilter("pending", "Pending", counts.pending));

  header.appendChild(filters);
  container.appendChild(header);

  let list;
  if (orderFilter === "pending") list = all.filter(o => o.status === "pending");
  else if (orderFilter === "approved") list = all.filter(o => o.status === "approved");
  else list = all.filter(o => o.status === "rejected" || o.status === "revoked");
  list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  if (list.length === 0){
    container.appendChild(el("div", { class: "card empty", text: "Abhi koi order nahi" }));
    return;

  for (const raw of list){
    const o = normalizeOrder(raw, raw.uid, raw.oid);

    const appMeta = appById(o.appId);

    head.appendChild(el("div", { class: "order-meta", text: fmtDateTime(o.createdAt) }));
    card.appendChild(head);

    const amountLine = el("div", { class: "row", style: "margin-top:8px" });
    amountLine.appendChild(el("span", { class: "price-badge", text: fmtMoney(o.amount) }));

function openDialog(opts){
  pauseAuto();
  const backdrop = el("div", { class: "dlg-backdrop" });
  const dlg = el("div", { class: "dlg", role: "dialog", "aria-modal": "true", "aria-label": opts.title || "Dialog" });
  dlg.appendChild(el("h2", { text: opts.title || "" }));
  if (opts.body) dlg.appendChild(el("p", { class: "small muted", text: opts.body }));
  let inputEl = null;
  if (opts.input){
    inputEl = opts.input.multiline
      ? el("textarea", { placeholder: opts.input.placeholder || "", style: "width:100%;margin-top:8px" })
      : el("input", { type: "text", placeholder: opts.input.placeholder || "", style: "width:100%;margin-top:8px" });
    dlg.appendChild(inputEl);
  }
  const actions = el("div", { class: "dlg-actions" });
  const cancel = el("button", { class: "btn ghost", type: "button", text: "Cancel" });
  const confirm = el("button", { class: "btn " + (opts.danger ? "danger" : "primary"), type: "button", text: opts.confirmText || "OK" });
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    try{ backdrop.remove(); }catch(e){}
    document.removeEventListener("keydown", onKey);
    resumeAuto();
  };
  const onKey = (e) => {
    if (e.key === "Escape") close();
    else if (e.key === "Tab"){
      const focusables = dlg.querySelectorAll("button, input, textarea, select, a[href]");
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  };
  cancel.addEventListener("click", close);
  confirm.addEventListener("click", async () => {
    if (!online){ toast("Internet nahi hai", "bad"); return; }
    confirm.disabled = true;
    const val = inputEl ? inputEl.value : "";
    let ok = true;
    try{
      if (typeof opts.onConfirm === "function") ok = await opts.onConfirm(val);
    }catch(e){ ok = false; toast("Error: " + (e.message || ""), "bad"); }
    if (ok !== false) close();
    else confirm.disabled = false;
  });
  actions.appendChild(cancel); actions.appendChild(confirm);
  dlg.appendChild(actions);
  backdrop.appendChild(dlg);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(backdrop);
  if (inputEl) inputEl.focus(); else confirm.focus();
}

async function togglePublished(appId, cb, wasPublished){
  if (!online){ toast("Internet nahi hai", "bad"); cb.checked = wasPublished; return; }

  const val = cb.checked;
  try{
    await update(ref(db, "paidApps/" + appId), { published: val, updatedAt: serverTimestamp() });
    toast(val ? "Published" : "Hidden", "ok", 2200);
  }catch(err){
    cb.checked = wasPublished;
    toast("Update fail: " + (err.message || ""), "bad");
  }
}

    }
  });

}

/* ============ APK READER (tested, unchanged) ============ */
const MAX_TAIL = 70000;
const MAX_CD = 32 * 1024 * 1024;
const MAX_MANIFEST = 16 * 1024 * 1024;

function withTimeout(promise, ms, msg) {
  let t;
  const timer = new Promise((_, rej) => { t = setTimeout(() => rej(new Error(msg || "timeout")), ms); });
  return Promise.race([promise, timer]).finally(() => clearTimeout(t));
}
async function readBytes(blob, start, end) { return new Uint8Array(await blob.slice(start, end).arrayBuffer()); }
async function inflateRaw(bytes) {
  if (typeof DecompressionStream === "function") {
    try {
      const ds = new DecompressionStream("deflate-raw");
      const out = new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
      return new Uint8Array(await withTimeout(out, 8000, "inflate timeout"));
    } catch (e) {}
  }
  const m = await withTimeout(import("https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"), 8000, "lib timeout");
  return m.inflateSync(bytes);
}
async function findManifest(file) {
  const size = file.size;
  if (size < 22) throw new Error("File bahut chhoti hai");
  const tailStart = Math.max(0, size - MAX_TAIL);
  const tail = await readBytes(file, tailStart, size);
  const tdv = new DataView(tail.buffer, tail.byteOffset, tail.byteLength);
  let eocd = -1;
  for (let i = tail.length - 22; i >= 0; i--) { if (tdv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
  if (eocd < 0) throw new Error("Ye valid APK/zip nahi lag raha");
  const entries = tdv.getUint16(eocd + 10, true);
  const cdSize = tdv.getUint32(eocd + 12, true);
  const cdOffset = tdv.getUint32(eocd + 16, true);
  if (cdSize === 0xffffffff || cdOffset === 0xffffffff || entries === 0xffff) throw new Error("ZIP64 APK abhi support nahi");
  if (cdSize > MAX_CD || cdOffset + cdSize > size) throw new Error("Central directory kharab hai");
  const cd = await readBytes(file, cdOffset, cdOffset + cdSize);
  const dv = new DataView(cd.buffer, cd.byteOffset, cd.byteLength);
  const dec = new TextDecoder("utf-8");
  let p = 0;
  for (let n = 0; n < entries && p + 46 <= cd.length; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = dec.decode(cd.subarray(p + 46, p + 46 + nameLen));
    if (name === "AndroidManifest.xml") {
      if (compSize > MAX_MANIFEST) throw new Error("Manifest bahut bada hai");
      const lh = await readBytes(file, localOff, localOff + 30);
      const ldv = new DataView(lh.buffer, lh.byteOffset, lh.byteLength);
      if (ldv.getUint32(0, true) !== 0x04034b50) throw new Error("Local header kharab hai");
      const dataStart = localOff + 30 + ldv.getUint16(26, true) + ldv.getUint16(28, true);
      const raw = await readBytes(file, dataStart, dataStart + compSize);
      if (method === 0) return raw;
      if (method === 8) return await inflateRaw(raw);
      throw new Error("Anjaan compression (" + method + ")");
    }
    p += 46 + nameLen + extraLen + commentLen;
  }
  throw new Error("AndroidManifest.xml nahi mila");
}
function parseAxml(buf) {
  const len = buf.length;
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  if (len < 16 || dv.getUint16(0, true) !== 0x0003) throw new Error("Manifest ka format samajh nahi aaya");
  const strings = [];
  const u32 = o => dv.getUint32(o, true);
  const u16 = o => dv.getUint16(o, true);
  let pos = u16(2) || 8;
  let guard = 0;
  while (pos + 8 <= len && guard++ < 200000) {
    const type = u16(pos), hdr = u16(pos + 2), size = u32(pos + 4);
    if (size < 8 || pos + size > len) break;
    if (type === 0x0001) {
      const count = Math.min(u32(pos + 8), 200000);
      const utf8 = (u32(pos + 16) & 0x100) !== 0;
      const strStart = pos + u32(pos + 20);
      const offs = pos + hdr;
      const u8dec = new TextDecoder("utf-8"), u16dec = new TextDecoder("utf-16le");
      for (let i = 0; i < count; i++) {
        let sp = strStart + u32(offs + 4 * i), s = "";
        if (sp >= len) { strings.push(""); continue; }
        if (utf8) {
          let c = buf[sp++]; if (c & 0x80) sp++;
          let b = buf[sp++]; if (b & 0x80) b = ((b & 0x7f) << 8) | buf[sp++];
          if (sp + b <= len) s = u8dec.decode(buf.subarray(sp, sp + b));
        } else {
          let l = u16(sp); sp += 2;
          if (l & 0x8000) { l = ((l & 0x7fff) << 16) | u16(sp); sp += 2; }
          if (sp + l * 2 <= len) s = u16dec.decode(buf.subarray(sp, sp + l * 2));
        }
        strings.push(s);
      }
    } else if (type === 0x0102) {
      if (strings[u32(pos + 20)] === "manifest") {
        const attrStart = u16(pos + 24), attrSize = u16(pos + 26), attrCount = Math.min(u16(pos + 28), 200);
        const out = { packageName: "", versionCode: 0, versionName: "" };
        for (let k = 0; k < attrCount; k++) {
          const a = pos + 16 + attrStart + k * (attrSize || 20);
          if (a + 20 > len) break;
          const name = strings[u32(a + 4)];
          const raw = u32(a + 8), dtype = buf[a + 15], data = u32(a + 16);
          const str = () => strings[raw !== 0xffffffff ? raw : data] || "";
          if (name === "package") out.packageName = dtype === 0x03 || raw !== 0xffffffff ? str() : "";
          else if (name === "versionName") out.versionName = str();
          else if (name === "versionCode") out.versionCode = (dtype === 0x10 || dtype === 0x11) ? data : (parseInt(str(), 10) || 0);
        }
        return out;
      }
    }
    pos += size;
  }
  throw new Error("Manifest me package nahi mila");
}
async function readApkInfo(file) {
  const run = async () => {
    const manifest = await findManifest(file);
    const info = parseAxml(manifest);
    return { ...info, sizeBytes: file.size };
  };
  return withTimeout(run(), 15000, "APK padhne me bahut der lagi");
}

function renderSales(container){
  const approved = allOrders().filter(o => o.status === "approved");
  const pending = allOrders().filter(o => o.status === "pending");
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const startOf7 = startOfDay - 6 * 24 * 3600 * 1000;
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  let totalRev = 0, todayRev = 0, weekRev = 0, monthRev = 0;
  for (const o of approved){
    const amt = num(o.amount, 0); totalRev += amt;
    const ts = num(o.approvedAt, 0) || num(o.createdAt, 0);
    if (ts >= startOfDay) todayRev += amt;
    if (ts >= startOf7) weekRev += amt;
    if (ts >= startOfMonth) monthRev += amt;
  }
  let pendingValue = 0;
  for (const o of pending) pendingValue += num(o.amount, 0);

  const head = el("div", { class: "card" });
  head.appendChild(el("h1", { text: "Sales" }));

  addStat(fmtMoney(totalRev), "Total Revenue");
  addStat(String(approved.length), "Approved Orders");
  addStat(fmtMoney(todayRev), "Aaj");

    chartCard.appendChild(el("div", { class: "empty", text: "Abhi koi approved sale nahi" }));
  } else {
    const maxRev = Math.max(...appList.map(a => a.revenue), 1);
    const chart = el("div", { class: "bar-chart" });
    for (const a of appList.slice(0, 12)){
      const h = Math.max(3, Math.round((a.revenue / maxRev) * 120));
      chart.appendChild(el("div", { class: "bar-col" },
        el("div", { class: "bar-val", text: "₹" + a.revenue }),
        el("div", { class: "bar", style: "height:" + h + "px" }),
        el("div", { class: "bar-lbl", text: a.name })
      ));
    }
    chartCard.appendChild(chart);

    const tableWrap = el("div", { class: "table-wrap", style: "margin-top:12px" });
    const table = el("table");
    const thead = el("thead");
    thead.appendChild(el("tr", {}, el("th", { text: "App" }), el("th", { text: "Orders" }), el("th", { text: "Revenue" })));
    table.appendChild(thead);
    const tbody = el("tbody");
    for (const a of appList){
      tbody.appendChild(el("tr", {}, el("td", { text: a.name }), el("td", { text: String(a.count), class: "mono" }), el("td", { text: fmtMoney(a.revenue), class: "mono" })));
    }

    chartCard.appendChild(tableWrap);

  container.appendChild(chartCard);
}

        name: n.name, packageName: n.packageName, versionCode: n.versionCode, version: n.version,
        size: n.size, category: n.category, publisher: n.publisher, rating: n.rating,
        downloads: n.downloads, icon: n.icon, description: n.description, fullDescription: n.fullDescription,
        whatsNew: n.whatsNew, screenshots: n.screenshots, price: n.price, published: n.published, featured: n.featured
      };
    }
    const json = JSON.stringify(out, null, 2);
    try{
      await navigator.clipboard.writeText(json);
      toast("Export clipboard me copy ho gaya (" + Object.keys(out).length + " apps)");
    }catch(e){
      const ta = el("textarea", { style: "width:100%;min-height:200px;margin-top:10px" });
      ta.value = json;
      const card = el("div", { class: "card" }, el("h2", { text: "Copy karein" }), ta);
      byId("view").appendChild(card);
      toast("Clipboard fail — neeche se copy karein", "bad");
    }
  }catch(e){ toast("Export fail: " + (e.message || ""), "bad"); }
}
async function importJson(text, previewEl){
  if (!online){ toast("Internet nahi hai", "bad"); return; }
  let parsed;
  try{ parsed = JSON.parse(text); } catch(e){ toast("Invalid JSON", "bad"); return; }
  let arr = [];
  if (Array.isArray(parsed)) arr = parsed;
  else if (parsed && typeof parsed === "object") arr = Object.entries(parsed).map(([aid, v]) => ({ id: aid, ...v }));
  const valid = arr.filter(a => a && typeof a === "object" && a.name && a.packageName);
  previewEl.textContent = valid.length + " valid apps mile. Import karein?";
  if (!valid.length){ toast("Koi valid app nahi mila", "bad"); return; }
  let imported = 0, skipped = 0;
  for (const a of valid){
    try{
      const pkg = String(a.packageName);
      const dup = Object.values(state.paidApps).find(x => x && x.packageName === pkg);
      if (dup){ skipped++; continue; }
      const newKey = push(ref(db, "paidApps")).key;
      if (typeof newKey !== "string" || !newKey){ skipped++; continue; }
      const appData = cleanUndefined({
        name: String(a.name), packageName: pkg,
        versionCode: parseInt(a.versionCode, 10) || 1,
        version: a.version || "", size: a.size || "", category: a.category || "",
        publisher: a.publisher || "", rating: num(a.rating, 0), downloads: a.downloads || "",
        icon: a.icon || "", description: a.description || "", fullDescription: a.fullDescription || "",
        whatsNew: a.whatsNew || "", screenshots: normalizeArray(a.screenshots),
        price: parseInt(a.price, 10) || 0,
        published: a.published !== false, featured: a.featured === true,
        createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      });
      const updates = {};
      updates["paidApps/" + newKey] = appData;
      if (a.apkUrl && /^https:\/\//i.test(a.apkUrl)){
        updates["premiumLinks/" + newKey] = cleanUndefined({ apkUrl: a.apkUrl, sha256: a.sha256 || undefined });
      }
      await update(ref(db), updates);
      imported++;
    }catch(e){ skipped++; }
  }
  toast(imported + " import hue, " + skipped + " skip hue", "ok", 5000);
  previewEl.textContent = imported + " import hue, " + skipped + " skip hue";
}

byId("playPause").addEventListener("click", () => {
  if (themeLocked){ themeLocked = false; cyclePaused = false; }
  else cyclePaused = !cyclePaused;
  if (!cyclePaused) themeStart = nowMs();
  setPauseBtn(); saveThemePref(); updateProgress();
});
byId("prevTheme").addEventListener("click", () => { themeLocked = true; cyclePaused = true; applyTheme(themeIdx - 1); setPauseBtn(); });
byId("nextTheme").addEventListener("click", () => { themeLocked = true; cyclePaused = true; applyTheme(themeIdx + 1); setPauseBtn(); });
byId("hintOk").addEventListener("click", () => {
  const h = byId("themeHint"); if (h) h.classList.add("hidden");
  try{ localStorage.setItem("themeHintSeen","1"); }catch(e){}
});

document.addEventListener("focusin", (e) => {
  const t = e.target;
  if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) pauseAuto();
});
document.addEventListener("focusout", () => {
  if (!document.querySelector("input:focus, textarea:focus, select:focus")){
    if (!document.querySelector(".dlg-backdrop")) resumeAuto();
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseAuto(); else resumeAuto();
});

const coordsEl = byId("coords");
document.addEventListener("mousemove", (e) => {
  if (!coordsEl) return;
  coordsEl.textContent = "x:" + Math.round(e.clientX) + " y:" + Math.round(e.clientY);
  coordsEl.style.left = (e.clientX + 12) + "px";
  coordsEl.style.top = (e.clientY + 12) + "px";
});
document.addEventListener("pointermove", (e) => {
  if (document.documentElement.getAttribute("data-theme") !== "depth") return;
  const card = e.target && e.target.closest ? e.target.closest(".card") : null;
  if (card) handleTilt(e, card);
}, { passive: true });

function initTheme(){
  loadThemePref();
  try{ reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  buildThemeDots();
  applyTheme(themeIdx);
  setPauseBtn();
  startThemeCycle();
  setInterval(updateProgress, 400);
  try{
    if (!localStorage.getItem("themeHintSeen")){
      const h = byId("themeHint"); if (h) h.classList.remove("hidden");
      setTimeout(() => { try{ const h2 = byId("themeHint"); if (h2) h2.classList.add("hidden"); }catch(e){} }, 12000);
    }
  }catch(e){}
}
function initGreeting(){
  const greetings = ["Welcome","स्वागत है","Bienvenido","欢迎","مرحبا","Bienvenue","Willkommen"];
  let i = 0;
  const elGreet = byId("greetLine");
  if (!elGreet) return;
  const tick = () => {
    if (document.documentElement.getAttribute("data-theme") === "world"){
      elGreet.textContent = greetings[i % greetings.length] + " · " + new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) + " IST";
      i++;
    } else {
      elGreet.textContent = "Premium APK Store — Admin";
    }
  };
  tick();
  setInterval(tick, 2000);
}

function boot(){
  initTheme();
  initGreeting();
  setOnline(navigator.onLine);
  byId("gate").classList.add("hidden");
  byId("gateLoader").appendChild(createLoader(56));
  handleRedirectResult();
  setTimeout(() => {
    if (!currentUser && byId("gate").classList.contains("hidden")){
      byId("gate").classList.remove("hidden");
      byId("appShell").classList.add("hidden");
    }
  }, 3500);
}
window.addEventListener("resize", () => { sizeCanvas(); });
window.addEventListener("beforeunload", () => { stopThemeCycle(); stopFx(); });
boot();
</script>
